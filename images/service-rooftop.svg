<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Rooftop HVAC unit service and maintenance">
  <defs>
    <linearGradient id="skyRoof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A8C0D8"/>
      <stop offset="100%" stop-color="#C8D8E8"/>
    </linearGradient>
    <linearGradient id="roofSurf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5A6A7A"/>
      <stop offset="100%" stop-color="#3A4A5A"/>
    </linearGradient>
    <linearGradient id="unitBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7A9AB5"/>
      <stop offset="100%" stop-color="#4A6A86"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="800" height="500" fill="url(#skyRoof)"/>

  <!-- Distant buildings silhouette -->
  <rect x="0" y="250" width="80" height="100" fill="#8AAAC0" opacity="0.4"/>
  <rect x="90" y="220" width="60" height="130" fill="#8AAAC0" opacity="0.4"/>
  <rect x="680" y="240" width="70" height="110" fill="#8AAAC0" opacity="0.4"/>
  <rect x="710" y="200" width="90" height="150" fill="#8AAAC0" opacity="0.4"/>

  <!-- Roof surface -->
  <rect x="0" y="310" width="800" height="190" fill="url(#roofSurf)"/>

  <!-- Roof texture -->
  <rect x="0" y="308" width="800" height="8" fill="#4A5A6A"/>
  <!-- TPO seams -->
  <line x1="0" y1="330" x2="800" y2="330" stroke="#4A5A6A" stroke-width="2" opacity="0.5"/>
  <line x1="0" y1="360" x2="800" y2="360" stroke="#4A5A6A" stroke-width="2" opacity="0.5"/>
  <line x1="0" y1="390" x2="800" y2="390" stroke="#4A5A6A" stroke-width="2" opacity="0.5"/>
  <line x1="0" y1="420" x2="800" y2="420" stroke="#4A5A6A" stroke-width="2" opacity="0.5"/>
  <line x1="0" y1="450" x2="800" y2="450" stroke="#4A5A6A" stroke-width="2" opacity="0.5"/>
  <line x1="200" y1="310" x2="200" y2="500" stroke="#4A5A6A" stroke-width="2" opacity="0.4"/>
  <line x1="400" y1="310" x2="400" y2="500" stroke="#4A5A6A" stroke-width="2" opacity="0.4"/>
  <line x1="600" y1="310" x2="600" y2="500" stroke="#4A5A6A" stroke-width="2" opacity="0.4"/>

  <!-- Curb / parapet edge at top of roof -->
  <rect x="0" y="304" width="800" height="10" fill="#3A4A5A"/>

  <!-- Main RTU unit (center, large) -->
  <g transform="translate(230, 150)">
    <!-- Unit housing -->
    <rect x="0" y="0" width="340" height="165" fill="url(#unitBody)" rx="6"/>

    <!-- Top rain cap / panels -->
    <rect x="0" y="0" width="340" height="20" fill="#8AAAC2" rx="6"/>
    <rect x="0" y="14" width="340" height="8" fill="#6A8AA8"/>

    <!-- Fan section (top) -->
    <rect x="10" y="22" width="150" height="80" fill="#3A5A76" rx="4"/>
    <!-- Fan housing circles -->
    <circle cx="55" cy="62" r="32" fill="#2A4A66" stroke="#5A7A96" stroke-width="3"/>
    <circle cx="55" cy="62" r="22" fill="#1A3A56"/>
    <!-- Fan blades -->
    <line x1="55" y1="40" x2="55" y2="84" stroke="#4A6A86" stroke-width="4"/>
    <line x1="33" y1="62" x2="77" y2="62" stroke="#4A6A86" stroke-width="4"/>
    <line x1="39" y1="46" x2="71" y2="78" stroke="#4A6A86" stroke-width="3"/>
    <line x1="39" y1="78" x2="71" y2="46" stroke="#4A6A86" stroke-width="3"/>
    <circle cx="120" cy="62" r="28" fill="#2A4A66" stroke="#5A7A96" stroke-width="3"/>
    <circle cx="120" cy="62" r="18" fill="#1A3A56"/>
    <line x1="120" y1="42" x2="120" y2="82" stroke="#4A6A86" stroke-width="3"/>
    <line x1="100" y1="62" x2="140" y2="62" stroke="#4A6A86" stroke-width="3"/>
    <line x1="106" y1="48" x2="134" y2="76" stroke="#4A6A86" stroke-width="2.5"/>
    <line x1="106" y1="76" x2="134" y2="48" stroke="#4A6A86" stroke-width="2.5"/>

    <!-- Coil / condenser section -->
    <rect x="170" y="22" width="160" height="80" fill="#3A5A76" rx="4"/>
    <!-- Coil fins -->
    <line x1="175" y1="32" x2="175" y2="94" stroke="#5A7A96" stroke-width="2"/>
    <line x1="185" y1="32" x2="185" y2="94" stroke="#5A7A96" stroke-width="2"/>
    <line x1="195" y1="32" x2="195" y2="94" stroke="#5A7A96" stroke-width="2"/>
    <line x1="205" y1="32" x2="205" y2="94" stroke="#5A7A96" stroke-width="2"/>
    <line x1="215" y1="32" x2="215" y2="94" stroke="#5A7A96" stroke-width="2"/>
    <line x1="225" y1="32" x2="225" y2="94" stroke="#5A7A96" stroke-width="2"/>
    <line x1="235" y1="32" x2="235" y2="94" stroke="#5A7A96" stroke-width="2"/>
    <line x1="245" y1="32" x2="245" y2="94" stroke="#5A7A96" stroke-width="2"/>
    <line x1="255" y1="32" x2="255" y2="94" stroke="#5A7A96" stroke-width="2"/>
    <line x1="265" y1="32" x2="265" y2="94" stroke="#5A7A96" stroke-width="2"/>
    <line x1="275" y1="32" x2="275" y2="94" stroke="#5A7A96" stroke-width="2"/>
    <line x1="285" y1="32" x2="285" y2="94" stroke="#5A7A96" stroke-width="2"/>
    <line x1="295" y1="32" x2="295" y2="94" stroke="#5A7A96" stroke-width="2"/>
    <line x1="305" y1="32" x2="305" y2="94" stroke="#5A7A96" stroke-width="2"/>
    <line x1="315" y1="32" x2="315" y2="94" stroke="#5A7A96" stroke-width="2"/>
    <line x1="325" y1="32" x2="325" y2="94" stroke="#5A7A96" stroke-width="2"/>

    <!-- Controls / access panel (bottom) -->
    <rect x="10" y="112" width="320" height="44" fill="#2A4A62" rx="4"/>
    <!-- Control display -->
    <rect x="20" y="120" width="100" height="28" fill="#0A1A2C" rx="3"/>
    <text x="70" y="130" text-anchor="middle" fill="#2ECC71" font-size="7" font-family="monospace">UNIT TEMP: 72°F</text>
    <text x="70" y="140" text-anchor="middle" fill="#3498DB" font-size="7" font-family="monospace">STATUS: COOLING</text>
    <!-- Indicator lights -->
    <circle cx="145" cy="130" r="6" fill="#2ECC71"/>
    <circle cx="163" cy="130" r="6" fill="#E8E040"/>
    <circle cx="181" cy="130" r="6" fill="#3498DB"/>
    <!-- Gauges -->
    <circle cx="230" cy="130" r="14" fill="#0A1A2C" stroke="#3A5A76" stroke-width="2"/>
    <line x1="230" y1="122" x2="235" y2="130" stroke="#E87B2A" stroke-width="2"/>
    <circle cx="265" cy="130" r="14" fill="#0A1A2C" stroke="#3A5A76" stroke-width="2"/>
    <line x1="265" y1="120" x2="268" y2="130" stroke="#2ECC71" stroke-width="2"/>
    <circle cx="300" cy="130" r="14" fill="#0A1A2C" stroke="#3A5A76" stroke-width="2"/>
    <line x1="300" y1="122" x2="296" y2="130" stroke="#3498DB" stroke-width="2"/>

    <!-- Unit nameplate -->
    <rect x="110" y="155" width="120" height="18" fill="#1A3A5C" rx="3"/>
    <text x="170" y="168" text-anchor="middle" fill="#E87B2A" font-size="9" font-family="Arial, sans-serif" font-weight="bold">RTU — 20 TON</text>

    <!-- Supply/return ducts at bottom -->
    <rect x="40" y="163" width="70" height="28" fill="#4A6A86" rx="2"/>
    <text x="75" y="181" text-anchor="middle" fill="#A0C0D8" font-size="7" font-family="Arial, sans-serif">SUPPLY</text>
    <rect x="230" y="163" width="70" height="28" fill="#4A6A86" rx="2"/>
    <text x="265" y="181" text-anchor="middle" fill="#A0C0D8" font-size="7" font-family="Arial, sans-serif">RETURN</text>
  </g>

  <!-- Tech / worker servicing unit -->
  <g transform="translate(630, 250)">
    <!-- Body -->
    <rect x="10" y="40" width="50" height="70" fill="#E87B2A" rx="4"/>
    <!-- Head -->
    <circle cx="35" cy="28" r="20" fill="#C09070"/>
    <!-- Hard hat -->
    <ellipse cx="35" cy="15" rx="22" ry="10" fill="#E8E040"/>
    <rect x="13" y="22" width="44" height="6" fill="#E8E040"/>
    <!-- Safety vest stripes -->
    <rect x="10" y="55" width="50" height="6" fill="#E8E040" opacity="0.8"/>
    <rect x="10" y="80" width="50" height="6" fill="#E8E040" opacity="0.8"/>
    <!-- Tool bag -->
    <rect x="-20" y="60" width="32" height="36" fill="#5A4A3A" rx="3"/>
    <rect x="-17" y="65" width="26" height="4" fill="#3A3030" rx="1"/>
    <rect x="-17" y="74" width="26" height="4" fill="#3A3030" rx="1"/>
    <rect x="-17" y="83" width="26" height="4" fill="#3A3030" rx="1"/>
    <!-- Multimeter / gauge in hand -->
    <rect x="58" y="56" width="28" height="40" fill="#2A2A2A" rx="3"/>
    <rect x="61" y="59" width="22" height="18" fill="#1A4A1A" rx="2"/>
    <text x="72" y="67" text-anchor="middle" fill="#2ECC71" font-size="5" font-family="monospace">R22</text>
    <text x="72" y="74" text-anchor="middle" fill="#E8E040" font-size="5" font-family="monospace">0.42</text>
    <circle cx="66" cy="84" r="4" fill="#3498DB"/>
    <circle cx="78" cy="84" r="4" fill="#CC2222"/>
    <!-- Arms -->
    <rect x="-6" y="45" width="18" height="40" fill="#E87B2A" rx="4"/>
    <rect x="52" y="45" width="18" height="30" fill="#E87B2A" rx="4"/>
    <!-- Legs -->
    <rect x="12" y="108" width="18" height="50" fill="#3A4A5A" rx="3"/>
    <rect x="34" y="108" width="18" height="50" fill="#3A4A5A" rx="3"/>
  </g>

  <!-- Small condenser unit (left) -->
  <g transform="translate(60, 220)">
    <rect x="0" y="0" width="120" height="90" fill="url(#unitBody)" rx="4"/>
    <rect x="0" y="0" width="120" height="14" fill="#8AAAC2" rx="4"/>
    <rect x="10" y="18" width="45" height="50" fill="#3A5A76" rx="3"/>
    <circle cx="32" cy="43" r="18" fill="#2A4A66" stroke="#5A7A96" stroke-width="2"/>
    <circle cx="32" cy="43" r="11" fill="#1A3A56"/>
    <line x1="32" y1="32" x2="32" y2="54" stroke="#4A6A86" stroke-width="2.5"/>
    <line x1="21" y1="43" x2="43" y2="43" stroke="#4A6A86" stroke-width="2.5"/>
    <rect x="62" y="18" width="48" height="50" fill="#3A5A76" rx="3"/>
    <line x1="68" y1="28" x2="68" y2="60" stroke="#5A7A96" stroke-width="1.5"/>
    <line x1="76" y1="28" x2="76" y2="60" stroke="#5A7A96" stroke-width="1.5"/>
    <line x1="84" y1="28" x2="84" y2="60" stroke="#5A7A96" stroke-width="1.5"/>
    <line x1="92" y1="28" x2="92" y2="60" stroke="#5A7A96" stroke-width="1.5"/>
    <line x1="100" y1="28" x2="100" y2="60" stroke="#5A7A96" stroke-width="1.5"/>
    <rect x="30" y="77" width="60" height="14" fill="#1A3A5C" rx="2"/>
    <text x="60" y="88" text-anchor="middle" fill="#E87B2A" font-size="7" font-family="Arial, sans-serif" font-weight="bold">COND UNIT</text>
  </g>

  <!-- Caption -->
  <rect x="0" y="458" width="800" height="42" fill="#1A3A5C" opacity="0.9"/>
  <text x="20" y="476" fill="white" font-size="14" font-family="Arial, sans-serif" font-weight="bold">Rooftop Unit Service &amp; Maintenance</text>
  <text x="20" y="493" fill="#E87B2A" font-size="11" font-family="Arial, sans-serif">Preventive Maintenance • Refrigerant Service • Controls Calibration</text>
  <text x="700" y="481" text-anchor="end" fill="#8AAAC2" font-size="11" font-family="Arial, sans-serif">Henderson, NV</text>
</svg>
