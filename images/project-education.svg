    <line x1="80" y1="262" x2="720" y2="262" stroke="#804040" stroke-width="1"/>
    <line x1="80" y1="273" x2="720" y2="273" stroke="#804040" stroke-width="1"/>
    <line x1="80" y1="284" x2="720" y2="284" stroke="#804040" stroke-width="1"/>
    <line x1="80" y1="295" x2="720" y2="295" stroke="#804040" stroke-width="1"/>
    <line x1="80" y1="306" x2="720" y2="306" stroke="#804040" stroke-width="1"/>
    <line x1="80" y1="317" x2="720" y2="317" stroke="#804040" stroke-width="1"/>
    <line x1="80" y1="328" x2="720" y2="328" stroke="#804040" stroke-width="1"/>
