    <circle cx="22" cy="15" r="10" fill="#3A5A76"/>
    <circle cx="58" cy="15" r="10" fill="#3A5A76"/>
    <rect x="20" y="28" width="40" height="10" fill="#1A3A5C" rx="1"/>
    <text x="40" y="36" text-anchor="middle" fill="#E87B2A" font-size="6" font-family="Arial, sans-serif" font-weight="bold">RTU-A2</text>
  </g>
  <g transform="translate(520, 125)">
    <rect x="0" y="0" width="80" height="30" fill="#5A7A96" rx="3"/>
    <circle cx="22" cy="15" r="10" fill="#3A5A76"/>
    <circle cx="58" cy="15" r="10" fill="#3A5A76"/>
    <rect x="20" y="28" width="40" height="10" fill="#1A3A5C" rx="1"/>
    <text x="40" y="36" text-anchor="middle" fill="#E87B2A" font-size="6" font-family="Arial, sans-serif" font-weight="bold">RTU-B1</text>
  </g>
  <g transform="translate(620, 125)">
    <rect x="0" y="0" width="80" height="30" fill="#5A7A96" rx="3"/>
    <circle cx="22" cy="15" r="10" fill="#3A5A76"/>
    <circle cx="58" cy="15" r="10" fill="#3A5A76"/>
    <rect x="20" y="28" width="40" height="10" fill="#1A3A5C" rx="1"/>
    <text x="40" y="36" text-anchor="middle" fill="#E87B2A" font-size="6" font-family="Arial, sans-serif" font-weight="bold">RTU-B2</text>
