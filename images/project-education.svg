  <rect x="160" y="255" width="55" height="40" fill="#B8D0E8" stroke="#8AAAC2" stroke-width="1.5" rx="1"/>
  <rect x="225" y="255" width="55" height="40" fill="#B8D0E8" stroke="#8AAAC2" stroke-width="1.5" rx="1"/>

