  <rect x="450" y="190" width="55" height="40" fill="#B8D0E8" stroke="#8AAAC2" stroke-width="1.5" rx="1"/>
  <rect x="515" y="190" width="55" height="40" fill="#B8D0E8" stroke="#8AAAC2" stroke-width="1.5" rx="1"/>
  <rect x="580" y="190" width="55" height="40" fill="#B8D0E8" stroke="#8AAAC2" stroke-width="1.5" rx="1"/>
  <rect x="645" y="190" width="55" height="40" fill="#B8D0E8" stroke="#8AAAC2" stroke-width="1.5" rx="1"/>

  <rect x="450" y="255" width="55" height="40" fill="#B8D0E8" stroke="#8AAAC2" stroke-width="1.5" rx="1"/>
  <rect x="515" y="255" width="55" height="40" fill="#B8D0E8" stroke="#8AAAC2" stroke-width="1.5" rx="1"/>
  <rect x="580" y="255" width="55" height="40" fill="#B8D0E8" stroke="#8AAAC2" stroke-width="1.5" rx="1"/>
  <rect x="645" y="255" width="55" height="40" fill="#B8D0E8" stroke="#8AAAC2" stroke-width="1.5" rx="1"/>

