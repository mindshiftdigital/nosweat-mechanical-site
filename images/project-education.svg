<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Educational building with commercial HVAC systems">
  <defs>
    <linearGradient id="skyEd" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C8D8E8"/>
      <stop offset="100%" stop-color="#E0ECFA"/>
    </linearGradient>
    <linearGradient id="brickGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#A87060"/>
      <stop offset="100%" stop-color="#C08870"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#skyEd)"/>

  <!-- Ground / lawn -->
