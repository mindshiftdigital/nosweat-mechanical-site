<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="New commercial construction with HVAC installation">
  <defs>
    <linearGradient id="skyNC" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D0DDE8"/>
      <stop offset="100%" stop-color="#E8F0F8"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#skyNC)"/>

  <!-- Ground / dirt -->
  <rect x="0" y="400" width="800" height="100" fill="#9A8060"/>
  <rect x="0" y="398" width="800" height="6" fill="#8A7050"/>

  <!-- Construction fence -->
  <rect x="0" y="370" width="800" height="30" fill="#E87B2A" opacity="0.15"/>
  <line x1="0" y1="370" x2="800" y2="370" stroke="#E87B2A" stroke-width="3" stroke-dasharray="20,10"/>
  <!-- Fence posts -->
  <rect x="60" y="368" width="6" height="60" fill="#E87B2A" opacity="0.6"/>
  <rect x="160" y="368" width="6" height="60" fill="#E87B2A" opacity="0.6"/>
  <rect x="260" y="368" width="6" height="60" fill="#E87B2A" opacity="0.6"/>
  <rect x="360" y="368" width="6" height="60" fill="#E87B2A" opacity="0.6"/>
  <rect x="460" y="368" width="6" height="60" fill="#E87B2A" opacity="0.6"/>
  <rect x="560" y="368" width="6" height="60" fill="#E87B2A" opacity="0.6"/>
  <rect x="660" y="368" width="6" height="60" fill="#E87B2A" opacity="0.6"/>
  <rect x="760" y="368" width="6" height="60" fill="#E87B2A" opacity="0.6"/>

  <!-- Building under construction (steel frame) -->
  <!-- Foundation -->
  <rect x="80" y="350" width="640" height="30" fill="#8A8A80" rx="2"/>
  <!-- Slab -->
  <rect x="80" y="340" width="640" height="14" fill="#A0A098" rx="1"/>

  <!-- Steel columns -->
  <rect x="80" y="80" width="20" height="270" fill="#6A7A8A" rx="2"/>
  <rect x="220" y="80" width="20" height="270" fill="#6A7A8A" rx="2"/>
  <rect x="360" y="80" width="20" height="270" fill="#6A7A8A" rx="2"/>
  <rect x="500" y="80" width="20" height="270" fill="#6A7A8A" rx="2"/>
  <rect x="640" y="80" width="20" height="270" fill="#6A7A8A" rx="2"/>
  <rect x="700" y="80" width="20" height="270" fill="#6A7A8A" rx="2"/>

  <!-- Floor decks -->
  <!-- Level 1 deck -->
  <rect x="80" y="200" width="640" height="12" fill="#8A9AAA" rx="1"/>
  <!-- Level 2 deck (partial) -->
  <rect x="80" y="100" width="640" height="12" fill="#8A9AAA" rx="1"/>

  <!-- Diagonal bracing -->
  <line x1="100" y1="112" x2="220" y2="200" stroke="#5A6A7A" stroke-width="4"/>
  <line x1="220" y1="112" x2="100" y2="200" stroke="#5A6A7A" stroke-width="4"/>
  <line x1="380" y1="112" x2="500" y2="200" stroke="#5A6A7A" stroke-width="4"/>
  <line x1="500" y1="112" x2="380" y2="200" stroke="#5A6A7A" stroke-width="4"/>
  <line x1="100" y1="212" x2="220" y2="340" stroke="#5A6A7A" stroke-width="4"/>
  <line x1="220" y1="212" x2="100" y2="340" stroke="#5A6A7A" stroke-width="4"/>
  <line x1="500" y1="212" x2="640" y2="340" stroke="#5A6A7A" stroke-width="4"/>
  <line x1="640" y1="212" x2="500" y2="340" stroke="#5A6A7A" stroke-width="4"/>

  <!-- Roof steel (partial) -->
  <rect x="80" y="78" width="640" height="6" fill="#5A6A7A"/>
  <line x1="80" y1="80" x2="240" y2="40" stroke="#5A6A7A" stroke-width="4"/>
  <line x1="240" y1="40" x2="400" y2="80" stroke="#5A6A7A" stroke-width="4"/>
  <line x1="400" y1="80" x2="560" y2="40" stroke="#5A6A7A" stroke-width="4"/>
  <line x1="560" y1="40" x2="720" y2="80" stroke="#5A6A7A" stroke-width="4"/>

  <!-- Roof deck (half complete) -->
  <rect x="80" y="38" width="320" height="40" fill="#8A9AAA" rx="1" opacity="0.7"/>
  <text x="240" y="64" text-anchor="middle" fill="#1A3A5C" font-size="9" font-family="Arial, sans-serif" opacity="0.6">ROOF DECK IN PROGRESS</text>

  <!-- Duct work rough-in (inside building) -->
  <!-- Round duct sections -->
  <ellipse cx="160" cy="250" rx="25" ry="10" fill="#C8D0DA" stroke="#A0A8B0" stroke-width="2"/>
  <rect x="135" y="250" width="50" height="50" fill="#C8D0DA" stroke="#A0A8B0" stroke-width="2"/>
  <ellipse cx="160" cy="300" rx="25" ry="10" fill="#B0B8C0" stroke="#A0A8B0" stroke-width="2"/>

  <ellipse cx="300" cy="240" rx="30" ry="12" fill="#C8D0DA" stroke="#A0A8B0" stroke-width="2"/>
  <rect x="270" y="240" width="60" height="70" fill="#C8D0DA" stroke="#A0A8B0" stroke-width="2"/>
  <ellipse cx="300" cy="310" rx="30" ry="12" fill="#B0B8C0" stroke="#A0A8B0" stroke-width="2"/>

  <!-- Rectangular duct main trunk -->
  <rect x="230" y="215" width="300" height="30" fill="#B8C4D0" stroke="#9AA8B8" stroke-width="2" rx="2"/>
  <!-- Duct label -->
  <text x="380" y="234" text-anchor="middle" fill="#1A3A5C" font-size="9" font-family="Arial, sans-serif" font-weight="bold">24"x16" MAIN SUPPLY</text>

  <!-- Crane (right side) -->
  <!-- Tower -->
  <rect x="710" y="20" width="20" height="360" fill="#E8A040" rx="2"/>
  <!-- Jib -->
  <rect x="320" y="20" width="410" height="14" fill="#E8A040" rx="2"/>
  <!-- Counter jib -->
  <rect x="710" y="20" width="90" height="10" fill="#E8A040" rx="2"/>
  <!-- Hook cable -->
  <line x1="460" y1="34" x2="460" y2="200" stroke="#6A6A6A" stroke-width="2"/>
  <!-- Hook with RTU unit being lifted -->
  <rect x="430" y="180" width="80" height="40" fill="#5A7A96" rx="3" opacity="0.9"/>
  <circle cx="452" cy="200" r="10" fill="#3A5A76"/>
  <circle cx="478" cy="200" r="10" fill="#3A5A76"/>
  <circle cx="504" cy="200" r="10" fill="#3A5A76"/>
  <rect x="448" y="175" width="54" height="8" fill="#1A3A5C" rx="1"/>
  <text x="475" y="182" text-anchor="middle" fill="#E87B2A" font-size="6" font-family="Arial, sans-serif" font-weight="bold">RTU UNIT</text>
  <!-- Rigging lines -->
  <line x1="460" y1="200" x2="435" y2="180" stroke="#6A6A6A" stroke-width="1.5"/>
  <line x1="460" y1="200" x2="510" y2="180" stroke="#6A6A6A" stroke-width="1.5"/>

  <!-- Construction sign -->
  <rect x="100" y="380" width="160" height="40" fill="#E87B2A" rx="4"/>
  <text x="180" y="396" text-anchor="middle" fill="white" font-size="10" font-family="Arial, sans-serif" font-weight="bold">NO SWEAT MECHANICAL</text>
  <text x="180" y="411" text-anchor="middle" fill="white" font-size="8" font-family="Arial, sans-serif">HVAC CONTRACTOR</text>

  <!-- Workers (silhouettes) -->
  <g transform="translate(560, 300)">
    <circle cx="16" cy="10" r="10" fill="#3A3A3A"/>
    <!-- Hard hat -->
    <ellipse cx="16" cy="4" rx="12" ry="6" fill="#E87B2A"/>
    <rect x="6" y="20" width="20" height="30" fill="#3A4A5A" rx="2"/>
    <rect x="2" y="22" width="8" height="22" fill="#3A4A5A" rx="2"/>
    <rect x="22" y="22" width="8" height="22" fill="#3A4A5A" rx="2"/>
  </g>
  <g transform="translate(590, 295)">
    <circle cx="16" cy="10" r="10" fill="#3A3A3A"/>
    <ellipse cx="16" cy="4" rx="12" ry="6" fill="#E8E820"/>
    <rect x="6" y="20" width="20" height="30" fill="#2A3A2A" rx="2"/>
    <rect x="2" y="22" width="8" height="22" fill="#2A3A2A" rx="2"/>
    <rect x="22" y="22" width="8" height="22" fill="#2A3A2A" rx="2"/>
  </g>

  <!-- Caption -->
  <rect x="0" y="458" width="800" height="42" fill="#1A3A5C" opacity="0.9"/>
  <text x="20" y="476" fill="white" font-size="14" font-family="Arial, sans-serif" font-weight="bold">Design-Build — New Commercial Construction</text>
  <text x="20" y="493" fill="#E87B2A" font-size="11" font-family="Arial, sans-serif">HVAC Design • Equipment Procurement • Installation • Commissioning</text>
  <text x="700" y="481" text-anchor="end" fill="#8AAAC2" font-size="11" font-family="Arial, sans-serif">Henderson, NV</text>
</svg>
