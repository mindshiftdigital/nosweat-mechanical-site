<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Industrial warehouse facility with HVAC systems">
  <defs>
    <linearGradient id="skyI" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C0CCD8"/>
      <stop offset="100%" stop-color="#D8E4EE"/>
    </linearGradient>
    <linearGradient id="warehouseBody" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#B0B8C4"/>
      <stop offset="100%" stop-color="#C8D0DA"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#skyI)"/>

  <!-- Ground -->
  <rect x="0" y="420" width="800" height="80" fill="#8A8A80"/>
  <rect x="0" y="418" width="800" height="6" fill="#7A7A70"/>

  <!-- Loading dock area -->
  <rect x="30" y="350" width="140" height="70" fill="#9A9898"/>
  <rect x="30" y="344" width="140" height="10" fill="#8A8888"/>

  <!-- Main warehouse structure -->
  <!-- Back wall -->
  <rect x="60" y="150" width="680" height="270" fill="url(#warehouseBody)"/>

  <!-- Barrel / arched roof -->
  <ellipse cx="400" cy="150" rx="340" ry="60" fill="#A8B0BC"/>
  <rect x="60" y="150" width="680" height="30" fill="#A8B0BC"/>

  <!-- Metal panel texture (vertical lines) -->
  <line x1="120" y1="160" x2="120" y2="420" stroke="#9A9AA2" stroke-width="1" opacity="0.5"/>
  <line x1="180" y1="160" x2="180" y2="420" stroke="#9A9AA2" stroke-width="1" opacity="0.5"/>
  <line x1="240" y1="160" x2="240" y2="420" stroke="#9A9AA2" stroke-width="1" opacity="0.5"/>
  <line x1="300" y1="160" x2="300" y2="420" stroke="#9A9AA2" stroke-width="1" opacity="0.5"/>
  <line x1="360" y1="160" x2="360" y2="420" stroke="#9A9AA2" stroke-width="1" opacity="0.5"/>
  <line x1="420" y1="160" x2="420" y2="420" stroke="#9A9AA2" stroke-width="1" opacity="0.5"/>
  <line x1="480" y1="160" x2="480" y2="420" stroke="#9A9AA2" stroke-width="1" opacity="0.5"/>
  <line x1="540" y1="160" x2="540" y2="420" stroke="#9A9AA2" stroke-width="1" opacity="0.5"/>
  <line x1="600" y1="160" x2="600" y2="420" stroke="#9A9AA2" stroke-width="1" opacity="0.5"/>
  <line x1="660" y1="160" x2="660" y2="420" stroke="#9A9AA2" stroke-width="1" opacity="0.5"/>

  <!-- Horizontal panel lines -->
  <line x1="60" y1="220" x2="740" y2="220" stroke="#9A9AA2" stroke-width="1.5" opacity="0.6"/>
  <line x1="60" y1="280" x2="740" y2="280" stroke="#9A9AA2" stroke-width="1.5" opacity="0.6"/>
  <line x1="60" y1="340" x2="740" y2="340" stroke="#9A9AA2" stroke-width="1.5" opacity="0.6"/>

  <!-- Dock doors -->
  <rect x="30" y="350" width="60" height="70" fill="#8A8888" stroke="#7A7878" stroke-width="2"/>
  <rect x="100" y="350" width="60" height="70" fill="#8A8888" stroke="#7A7878" stroke-width="2"/>
  <!-- Door panels -->
  <rect x="33" y="353" width="54" height="14" fill="#9A9898"/>
  <rect x="33" y="370" width="54" height="14" fill="#9A9898"/>
  <rect x="33" y="387" width="54" height="14" fill="#9A9898"/>
  <rect x="103" y="353" width="54" height="14" fill="#9A9898"/>
  <rect x="103" y="370" width="54" height="14" fill="#9A9898"/>
  <rect x="103" y="387" width="54" height="14" fill="#9A9898"/>

  <!-- Dock levelers -->
  <rect x="30" y="415" width="60" height="8" fill="#7A7878"/>
  <rect x="100" y="415" width="60" height="8" fill="#7A7878"/>

  <!-- Main entrance (office wing) -->
  <rect x="580" y="230" width="160" height="190" fill="#C8D4E0"/>
  <rect x="580" y="228" width="160" height="8" fill="#1A3A5C"/>
  <!-- Office windows -->
  <rect x="595" y="248" width="55" height="40" fill="#B8CCE0" stroke="#8AAAC2" stroke-width="1" rx="1"/>
  <rect x="660" y="248" width="55" height="40" fill="#B8CCE0" stroke="#8AAAC2" stroke-width="1" rx="1"/>
  <rect x="595" y="300" width="55" height="40" fill="#B8CCE0" stroke="#8AAAC2" stroke-width="1" rx="1"/>
  <rect x="660" y="300" width="55" height="40" fill="#B8CCE0" stroke="#8AAAC2" stroke-width="1" rx="1"/>
  <!-- Office entrance door -->
  <rect x="635" y="360" width="60" height="60" fill="#B8CCE0" stroke="#8AAAC2" stroke-width="2" rx="1"/>

  <!-- Rooftop industrial ventilators -->
  <!-- Make-up air units -->
  <g transform="translate(100, 108)">
    <rect x="0" y="0" width="110" height="50" fill="#5A7A96" rx="4"/>
    <rect x="5" y="5" width="100" height="20" fill="#4A6A86" rx="2"/>
    <circle cx="30" cy="35" r="12" fill="#3A5A76"/>
    <circle cx="60" cy="35" r="12" fill="#3A5A76"/>
    <circle cx="90" cy="35" r="12" fill="#3A5A76"/>
    <rect x="30" y="48" width="50" height="10" fill="#1A3A5C" rx="1"/>
    <text x="55" y="57" text-anchor="middle" fill="#E87B2A" font-size="7" font-family="Arial, sans-serif" font-weight="bold">MAU-1</text>
  </g>

  <g transform="translate(280, 108)">
    <rect x="0" y="0" width="110" height="50" fill="#5A7A96" rx="4"/>
    <rect x="5" y="5" width="100" height="20" fill="#4A6A86" rx="2"/>
    <circle cx="30" cy="35" r="12" fill="#3A5A76"/>
    <circle cx="60" cy="35" r="12" fill="#3A5A76"/>
    <circle cx="90" cy="35" r="12" fill="#3A5A76"/>
    <rect x="30" y="48" width="50" height="10" fill="#1A3A5C" rx="1"/>
    <text x="55" y="57" text-anchor="middle" fill="#E87B2A" font-size="7" font-family="Arial, sans-serif" font-weight="bold">MAU-2</text>
  </g>

  <!-- Exhaust fans on roof ridge -->
  <g transform="translate(460, 100)">
    <rect x="0" y="0" width="50" height="50" fill="#6A6A6A" rx="40"/>
    <circle cx="25" cy="25" r="20" fill="#5A5A5A"/>
    <circle cx="25" cy="25" r="10" fill="#4A4A4A"/>
    <line x1="25" y1="8" x2="25" y2="42" stroke="#7A7A7A" stroke-width="2"/>
    <line x1="8" y1="25" x2="42" y2="25" stroke="#7A7A7A" stroke-width="2"/>
    <text x="25" y="62" text-anchor="middle" fill="#5A5A5A" font-size="7" font-family="Arial, sans-serif">EXHST</text>
  </g>
  <g transform="translate(540" y="100)">
  </g>
  <circle cx="570" cy="125" r="22" fill="#6A6A6A"/>
  <circle cx="570" cy="125" r="14" fill="#5A5A5A"/>
  <circle cx="570" cy="125" r="7" fill="#4A4A4A"/>
  <line x1="570" y1="107" x2="570" y2="143" stroke="#7A7A7A" stroke-width="2"/>
  <line x1="552" y1="125" x2="588" y2="125" stroke="#7A7A7A" stroke-width="2"/>

  <!-- Evaporative coolers (side mounted) -->
  <rect x="62" y="200" width="40" height="50" fill="#7A9AB5" rx="3"/>
  <rect x="62" y="200" width="40" height="8" fill="#5A7A95" rx="2"/>
  <!-- Louvers -->
  <line x1="65" y1="214" x2="99" y2="214" stroke="#4A6A85" stroke-width="2"/>
  <line x1="65" y1="222" x2="99" y2="222" stroke="#4A6A85" stroke-width="2"/>
  <line x1="65" y1="230" x2="99" y2="230" stroke="#4A6A85" stroke-width="2"/>
  <line x1="65" y1="238" x2="99" y2="238" stroke="#4A6A85" stroke-width="2"/>

  <!-- Gas piping -->
  <rect x="280" y="420" width="200" height="8" fill="#E8A040" rx="2"/>
  <text x="380" y="435" text-anchor="middle" fill="#B87020" font-size="8" font-family="Arial, sans-serif" font-weight="bold">GAS SUPPLY</text>

  <!-- Company name on building -->
  <rect x="240" y="290" width="200" height="28" fill="#1A3A5C" opacity="0.8" rx="3"/>
  <text x="340" y="309" text-anchor="middle" fill="white" font-size="13" font-family="Arial, sans-serif" font-weight="bold" letter-spacing="1">DISTRIBUTION CTR</text>

  <!-- Caption -->
  <rect x="0" y="458" width="800" height="42" fill="#1A3A5C" opacity="0.9"/>
  <text x="20" y="476" fill="white" font-size="14" font-family="Arial, sans-serif" font-weight="bold">Industrial / Warehouse — HVAC &amp; Ventilation</text>
  <text x="20" y="493" fill="#E87B2A" font-size="11" font-family="Arial, sans-serif">Make-Up Air Units • Evaporative Cooling • Exhaust Systems</text>
  <text x="700" y="481" text-anchor="end" fill="#8AAAC2" font-size="11" font-family="Arial, sans-serif">Henderson, NV</text>
</svg>
