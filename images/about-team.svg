<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Professional team at work">
  <defs>
    <linearGradient id="bgTeam" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1A3A5C"/>
      <stop offset="100%" stop-color="#2A5A8C"/>
    </linearGradient>
    <linearGradient id="tableGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8A7060"/>
      <stop offset="100%" stop-color="#6A5040"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgTeam)"/>

  <!-- Conference room back wall -->
  <rect x="0" y="0" width="800" height="340" fill="#1E3D5E" rx="0"/>
  <!-- Wall accent stripe -->
  <rect x="0" y="160" width="800" height="4" fill="#E87B2A" opacity="0.4"/>
  <rect x="0" y="166" width="800" height="170" fill="#162E48"/>

  <!-- Whiteboard on wall -->
  <rect x="80" y="30" width="320" height="200" fill="#F0F4F8" rx="4"/>
  <rect x="80" y="30" width="320" height="10" fill="#A8A8A8" rx="2"/>
  <!-- Whiteboard content - HVAC schematic -->
  <rect x="95" y="55" width="290" height="160" fill="#FAFCFE"/>
  <!-- Schematic lines -->
  <rect x="110" y="80" width="60" height="40" fill="none" stroke="#1A3A5C" stroke-width="2"/>
  <text x="140" y="105" text-anchor="middle" fill="#1A3A5C" font-size="8" font-family="Arial, sans-serif">AHU</text>
  <line x1="170" y1="100" x2="220" y2="100" stroke="#1A3A5C" stroke-width="2"/>
  <rect x="220" y="80" width="50" height="40" fill="none" stroke="#1A3A5C" stroke-width="2"/>
  <text x="245" y="105" text-anchor="middle" fill="#1A3A5C" font-size="8" font-family="Arial, sans-serif">ZONE</text>
  <line x1="145" y1="120" x2="145" y2="160" stroke="#E87B2A" stroke-width="2"/>
  <circle cx="145" cy="170" r="12" fill="none" stroke="#E87B2A" stroke-width="2"/>
  <text x="145" y="174" text-anchor="middle" fill="#E87B2A" font-size="7" font-family="Arial, sans-serif">FAN</text>
  <!-- Project schedule bars -->
  <text x="110" y="150" fill="#5A7A96" font-size="7" font-family="Arial, sans-serif">PHASE 1</text>
  <rect x="150" y="143" width="80" height="10" fill="#1A3A5C" rx="2"/>
  <text x="110" y="168" fill="#5A7A96" font-size="7" font-family="Arial, sans-serif">PHASE 2</text>
  <rect x="150" y="161" width="120" height="10" fill="#E87B2A" rx="2"/>
  <text x="110" y="186" fill="#5A7A96" font-size="7" font-family="Arial, sans-serif">PHASE 3</text>
  <rect x="150" y="179" width="60" height="10" fill="#5A7A96" rx="2"/>

  <!-- Company logo on wall -->
  <rect x="520" y="50" width="200" height="80" fill="#1A3A5C" rx="6"/>
  <rect x="530" y="60" width="30" height="30" fill="#E87B2A" rx="3"/>
  <!-- Grid icon in orange box -->
  <line x1="538" y1="68" x2="552" y2="68" stroke="white" stroke-width="2"/>
  <line x1="538" y1="75" x2="552" y2="75" stroke="white" stroke-width="2"/>
  <line x1="538" y1="82" x2="552" y2="82" stroke="white" stroke-width="2"/>
  <line x1="545" y1="63" x2="545" y2="92" stroke="white" stroke-width="2"/>
  <text x="570" y="76" fill="white" font-size="13" font-family="Arial, sans-serif" font-weight="bold">NO SWEAT</text>
  <text x="570" y="94" fill="#E87B2A" font-size="11" font-family="Arial, sans-serif" font-weight="bold">MECHANICAL</text>
  <text x="620" y="118" text-anchor="middle" fill="#8AAAC2" font-size="9" font-family="Arial, sans-serif">Henderson, NV • Lic. #12345</text>

  <!-- Conference table -->
  <ellipse cx="400" cy="380" rx="340" ry="80" fill="url(#tableGrad)"/>
  <ellipse cx="400" cy="374" rx="340" ry="80" fill="#8A7060"/>
  <ellipse cx="400" cy="370" rx="334" ry="76" fill="#9A8070"/>

  <!-- Table surface sheen -->
  <ellipse cx="380" cy="358" rx="180" ry="30" fill="white" opacity="0.06"/>

  <!-- Person 1 (far left, standing) -->
  <g transform="translate(68, 200)">
    <!-- Body -->
    <rect x="10" y="50" width="44" height="80" fill="#2E4E6E" rx="4"/>
    <!-- Head -->
    <circle cx="32" cy="38" r="22" fill="#D4956A"/>
    <!-- Hair -->
    <ellipse cx="32" cy="20" rx="22" ry="12" fill="#3A2A1A"/>
    <!-- Collar/tie -->
    <rect x="24" y="58" width="16" height="30" fill="#1A3A5C"/>
    <polygon points="32,60 28,68 32,75 36,68" fill="#E87B2A"/>
    <!-- Arms -->
    <rect x="-4" y="55" width="16" height="50" fill="#2E4E6E" rx="4"/>
    <rect x="52" y="55" width="16" height="50" fill="#2E4E6E" rx="4"/>
    <!-- Name tag -->
    <rect x="14" y="80" width="36" height="20" fill="white" rx="2" opacity="0.9"/>
    <text x="32" y="89" text-anchor="middle" fill="#1A3A5C" font-size="5" font-family="Arial, sans-serif" font-weight="bold">KYLE H.</text>
    <text x="32" y="96" text-anchor="middle" fill="#5A7A96" font-size="4.5" font-family="Arial, sans-serif">PRESIDENT</text>
  </g>

  <!-- Person 2 (left of center, seated) -->
  <g transform="translate(175, 240)">
    <rect x="8" y="40" width="48" height="70" fill="#3A5A3A" rx="4"/>
    <circle cx="32" cy="28" r="20" fill="#C47858"/>
    <ellipse cx="32" cy="12" rx="20" ry="10" fill="#4A3020"/>
    <rect x="22" y="50" width="20" height="28" fill="#2A4A2A"/>
    <rect x="-2" y="46" width="12" height="44" fill="#3A5A3A" rx="3"/>
    <rect x="54" y="46" width="12" height="44" fill="#3A5A3A" rx="3"/>
    <rect x="12" y="75" width="40" height="20" fill="white" rx="2" opacity="0.9"/>
    <text x="32" y="84" text-anchor="middle" fill="#1A3A5C" font-size="5" font-family="Arial, sans-serif" font-weight="bold">MARIA S.</text>
    <text x="32" y="91" text-anchor="middle" fill="#5A7A96" font-size="4" font-family="Arial, sans-serif">DIR. OPERATIONS</text>
  </g>

  <!-- Person 3 (seated center-left) -->
  <g transform="translate(280, 250)">
    <rect x="8" y="38" width="48" height="68" fill="#4A3A5A" rx="4"/>
    <circle cx="32" cy="26" r="20" fill="#A86848"/>
    <ellipse cx="32" cy="10" rx="20" ry="10" fill="#1A1A1A"/>
    <rect x="22" y="48" width="20" height="26" fill="#3A2A4A"/>
    <rect x="-2" y="44" width="12" height="42" fill="#4A3A5A" rx="3"/>
    <rect x="54" y="44" width="12" height="42" fill="#4A3A5A" rx="3"/>
    <!-- Laptop on table -->
    <rect x="34" y="95" width="40" height="28" fill="#2A2A2A" rx="2"/>
    <rect x="36" y="97" width="36" height="22" fill="#3498DB" opacity="0.6" rx="1"/>
    <rect x="10" y="122" width="70" height="6" fill="#1A1A1A" rx="1"/>
    <rect x="12" y="73" width="40" height="18" fill="white" rx="2" opacity="0.9"/>
    <text x="32" y="81" text-anchor="middle" fill="#1A3A5C" font-size="5" font-family="Arial, sans-serif" font-weight="bold">JAMES T.</text>
    <text x="32" y="88" text-anchor="middle" fill="#5A7A96" font-size="4" font-family="Arial, sans-serif">LEAD PM</text>
  </g>

  <!-- Person 4 (seated center-right) -->
  <g transform="translate(430, 250)">
    <rect x="8" y="38" width="48" height="68" fill="#5A3A3A" rx="4"/>
    <circle cx="32" cy="26" r="20" fill="#B88060"/>
    <ellipse cx="32" cy="10" rx="20" ry="10" fill="#2A1A10"/>
    <rect x="22" y="48" width="20" height="26" fill="#4A2A2A"/>
    <rect x="-2" y="44" width="12" height="42" fill="#5A3A3A" rx="3"/>
    <rect x="54" y="44" width="12" height="42" fill="#5A3A3A" rx="3"/>
    <!-- Papers on table -->
    <rect x="34" y="97" width="50" height="32" fill="white" opacity="0.85" rx="1"/>
    <line x1="38" y1="104" x2="80" y2="104" stroke="#AAAAAA" stroke-width="1"/>
    <line x1="38" y1="110" x2="80" y2="110" stroke="#AAAAAA" stroke-width="1"/>
    <line x1="38" y1="116" x2="70" y2="116" stroke="#AAAAAA" stroke-width="1"/>
    <rect x="12" y="73" width="40" height="18" fill="white" rx="2" opacity="0.9"/>
    <text x="32" y="81" text-anchor="middle" fill="#1A3A5C" font-size="5" font-family="Arial, sans-serif" font-weight="bold">RACHEL O.</text>
    <text x="32" y="88" text-anchor="middle" fill="#5A7A96" font-size="4" font-family="Arial, sans-serif">SVC MANAGER</text>
  </g>

  <!-- Person 5 (right of center) -->
  <g transform="translate(560, 240)">
    <rect x="8" y="40" width="48" height="70" fill="#3A4A5A" rx="4"/>
    <circle cx="32" cy="28" r="20" fill="#C49078"/>
    <ellipse cx="32" cy="12" rx="20" ry="10" fill="#5A4030"/>
    <rect x="22" y="50" width="20" height="28" fill="#2A3A4A"/>
    <rect x="-2" y="46" width="12" height="44" fill="#3A4A5A" rx="3"/>
    <rect x="54" y="46" width="12" height="44" fill="#3A4A5A" rx="3"/>
    <rect x="12" y="75" width="40" height="20" fill="white" rx="2" opacity="0.9"/>
    <text x="32" y="84" text-anchor="middle" fill="#1A3A5C" font-size="5" font-family="Arial, sans-serif" font-weight="bold">DEREK M.</text>
    <text x="32" y="91" text-anchor="middle" fill="#5A7A96" font-size="4" font-family="Arial, sans-serif">ESTIMATOR</text>
  </g>

  <!-- Person 6 (far right, standing) -->
  <g transform="translate(660, 200)">
    <rect x="10" y="50" width="44" height="80" fill="#2A5A4A" rx="4"/>
    <circle cx="32" cy="38" r="22" fill="#C09080"/>
    <ellipse cx="32" cy="20" rx="22" ry="12" fill="#1A1A1A"/>
    <rect x="24" y="58" width="16" height="30" fill="#1A4A3A"/>
    <rect x="-4" y="55" width="16" height="50" fill="#2A5A4A" rx="4"/>
    <rect x="52" y="55" width="16" height="50" fill="#2A5A4A" rx="4"/>
    <!-- Clipboard -->
    <rect x="52" y="70" width="32" height="40" fill="#D0C0A0" rx="2"/>
    <rect x="58" y="65" width="20" height="8" fill="#A09080" rx="1"/>
    <line x1="56" y1="82" x2="80" y2="82" stroke="#8A8888" stroke-width="1"/>
    <line x1="56" y1="88" x2="80" y2="88" stroke="#8A8888" stroke-width="1"/>
    <line x1="56" y1="94" x2="74" y2="94" stroke="#8A8888" stroke-width="1"/>
    <rect x="14" y="80" width="36" height="20" fill="white" rx="2" opacity="0.9"/>
    <text x="32" y="89" text-anchor="middle" fill="#1A3A5C" font-size="5" font-family="Arial, sans-serif" font-weight="bold">LINDA P.</text>
    <text x="32" y="96" text-anchor="middle" fill="#5A7A96" font-size="4" font-family="Arial, sans-serif">SAFETY &amp; COMP.</text>
  </g>

  <!-- Caption bar -->
  <rect x="0" y="460" width="800" height="40" fill="#1A3A5C" opacity="0.95"/>
  <text x="20" y="477" fill="white" font-size="14" font-family="Arial, sans-serif" font-weight="bold">No Sweat Mechanical — Leadership Team</text>
  <text x="20" y="494" fill="#E87B2A" font-size="11" font-family="Arial, sans-serif">20+ Years of Commercial HVAC Experience</text>
  <text x="700" y="481" text-anchor="end" fill="#8AAAC2" font-size="11" font-family="Arial, sans-serif">Henderson, NV</text>
</svg>
