<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Retail commercial building with HVAC systems">
  <defs>
    <linearGradient id="skyR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B8D4E8"/>
      <stop offset="100%" stop-color="#D9EAF5"/>
    </linearGradient>
    <linearGradient id="buildR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8EDF5"/>
      <stop offset="100%" stop-color="#C8D0DC"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#skyR)"/>

  <!-- Ground -->
  <rect x="0" y="400" width="800" height="100" fill="#8A9A7A"/>
  <rect x="0" y="398" width="800" height="8" fill="#7A8A6A"/>

  <!-- Parking lot -->
  <rect x="50" y="400" width="700" height="80" fill="#9A9A9A"/>
  <rect x="100" y="418" width="80" height="4" fill="white" opacity="0.8"/>
  <rect x="220" y="418" width="80" height="4" fill="white" opacity="0.8"/>
  <rect x="340" y="418" width="80" height="4" fill="white" opacity="0.8"/>
  <rect x="460" y="418" width="80" height="4" fill="white" opacity="0.8"/>
  <rect x="580" y="418" width="80" height="4" fill="white" opacity="0.8"/>

  <!-- Building main body -->
  <rect x="80" y="160" width="640" height="240" fill="url(#buildR)" rx="2"/>

  <!-- Roof parapet -->
  <rect x="70" y="148" width="660" height="20" fill="#B0BAC8" rx="2"/>
  <rect x="70" y="140" width="660" height="12" fill="#D0D8E4" rx="2"/>

  <!-- Facade panels -->
  <rect x="80" y="160" width="640" height="30" fill="#1A3A5C"/>
  <text x="400" y="181" text-anchor="middle" fill="white" font-size="16" font-family="Arial, sans-serif" font-weight="bold" letter-spacing="3">RETAIL SHOPPING CENTER</text>

  <!-- Storefront windows -->
  <rect x="95" y="210" width="130" height="120" fill="#B8D4EE" stroke="#8AAAC2" stroke-width="2" rx="1"/>
  <rect x="95" y="210" width="130" height="6" fill="#7AAAC0"/>
  <line x1="160" y1="210" x2="160" y2="330" stroke="#8AAAC2" stroke-width="1.5"/>

  <rect x="245" y="210" width="140" height="120" fill="#B8D4EE" stroke="#8AAAC2" stroke-width="2" rx="1"/>
  <line x1="315" y1="210" x2="315" y2="330" stroke="#8AAAC2" stroke-width="1.5"/>

  <!-- Center entrance -->
  <rect x="320" y="230" width="160" height="170" fill="#C8DEEE" stroke="#8AAAC2" stroke-width="2" rx="2"/>
  <rect x="320" y="230" width="160" height="8" fill="#1A3A5C"/>
  <line x1="400" y1="238" x2="400" y2="400" stroke="#8AAAC2" stroke-width="1.5"/>
  <!-- Entrance canopy -->
  <rect x="305" y="220" width="190" height="14" fill="#1A3A5C" rx="2"/>

  <rect x="490" y="210" width="140" height="120" fill="#B8D4EE" stroke="#8AAAC2" stroke-width="2" rx="1"/>
  <line x1="560" y1="210" x2="560" y2="330" stroke="#8AAAC2" stroke-width="1.5"/>

  <rect x="640" y="210" width="80" height="120" fill="#B8D4EE" stroke="#8AAAC2" stroke-width="2" rx="1"/>

  <!-- Rooftop units -->
  <!-- RTU 1 -->
  <rect x="110" y="115" width="90" height="35" fill="#5A7A96" rx="3"/>
  <rect x="120" y="108" width="70" height="10" fill="#4A6A86" rx="2"/>
  <circle cx="138" cy="130" r="12" fill="#3A5A76"/>
  <circle cx="172" cy="130" r="12" fill="#3A5A76"/>
  <rect x="130" y="140" width="30" height="8" fill="#1A3A5C" rx="1"/>
  <text x="145" y="147" text-anchor="middle" fill="#E87B2A" font-size="6" font-family="Arial, sans-serif" font-weight="bold">RTU</text>

  <!-- RTU 2 -->
  <rect x="330" y="110" width="100" height="35" fill="#5A7A96" rx="3"/>
  <rect x="340" y="103" width="80" height="10" fill="#4A6A86" rx="2"/>
  <circle cx="355" cy="126" r="13" fill="#3A5A76"/>
  <circle cx="385" cy="126" r="13" fill="#3A5A76"/>
  <circle cx="415" cy="126" r="13" fill="#3A5A76"/>
  <rect x="345" y="137" width="40" height="8" fill="#1A3A5C" rx="1"/>
  <text x="365" y="144" text-anchor="middle" fill="#E87B2A" font-size="6" font-family="Arial, sans-serif" font-weight="bold">RTU-MAIN</text>

  <!-- RTU 3 -->
  <rect x="580" y="115" width="90" height="35" fill="#5A7A96" rx="3"/>
  <circle cx="605" cy="130" r="12" fill="#3A5A76"/>
  <circle cx="643" cy="130" r="12" fill="#3A5A76"/>
  <rect x="600" y="140" width="30" height="8" fill="#1A3A5C" rx="1"/>
  <text x="615" y="147" text-anchor="middle" fill="#E87B2A" font-size="6" font-family="Arial, sans-serif" font-weight="bold">RTU</text>

  <!-- Signage -->
  <rect x="140" y="345" width="100" height="30" fill="#E87B2A" rx="3"/>
  <text x="190" y="365" text-anchor="middle" fill="white" font-size="11" font-family="Arial, sans-serif" font-weight="bold">ANCHOR</text>
  <rect x="490" y="345" width="120" height="30" fill="#1A3A5C" rx="3"/>
  <text x="550" y="365" text-anchor="middle" fill="white" font-size="11" font-family="Arial, sans-serif" font-weight="bold">GROCERY</text>

  <!-- Caption bar -->
  <rect x="0" y="450" width="800" height="50" fill="#1A3A5C" opacity="0.9"/>
  <text x="20" y="471" fill="white" font-size="14" font-family="Arial, sans-serif" font-weight="bold">Retail Shopping Center — Commercial HVAC</text>
  <text x="20" y="490" fill="#E87B2A" font-size="11" font-family="Arial, sans-serif">Rooftop Package Units • Refrigeration • BAS Controls</text>
  <text x="700" y="481" text-anchor="end" fill="#8AAAC2" font-size="11" font-family="Arial, sans-serif">Henderson, NV</text>
</svg>
