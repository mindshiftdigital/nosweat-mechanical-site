<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-label="Commercial mechanical room interior">
  <defs>
    <linearGradient id="wallGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D8DDE4"/>
      <stop offset="100%" stop-color="#B8BEC8"/>
    </linearGradient>
    <linearGradient id="floorGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9AA5B0"/>
      <stop offset="100%" stop-color="#707A85"/>
    </linearGradient>
    <linearGradient id="equipGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5A7A96"/>
      <stop offset="100%" stop-color="#2E4A62"/>
    </linearGradient>
    <linearGradient id="pipeHot" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C0392B"/>
      <stop offset="100%" stop-color="#E74C3C"/>
    </linearGradient>
    <linearGradient id="pipeCold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2980B9"/>
      <stop offset="100%" stop-color="#3498DB"/>
    </linearGradient>
  </defs>

  <!-- Room walls and floor -->
  <rect width="900" height="600" fill="url(#wallGrad)"/>
  <rect x="0" y="480" width="900" height="120" fill="url(#floorGrad)"/>

  <!-- Back wall panels -->
  <rect x="10" y="10" width="880" height="470" fill="#C8CDD6" rx="2" opacity="0.5"/>
  <rect x="10" y="10" width="880" height="4" fill="#A8ADB8" opacity="0.8"/>

  <!-- Ceiling light fixtures -->
  <rect x="80" y="10" width="120" height="20" fill="#E8EDF5" rx="2"/>
  <rect x="80" y="28" width="120" height="4" fill="#FFE8A0" opacity="0.8"/>
  <rect x="360" y="10" width="120" height="20" fill="#E8EDF5" rx="2"/>
  <rect x="360" y="28" width="120" height="4" fill="#FFE8A0" opacity="0.8"/>
  <rect x="640" y="10" width="120" height="20" fill="#E8EDF5" rx="2"/>
  <rect x="640" y="28" width="120" height="4" fill="#FFE8A0" opacity="0.8"/>

  <!-- AHU / Air Handler (large unit, left) -->
  <g transform="translate(40, 120)">
    <rect x="0" y="0" width="180" height="280" fill="url(#equipGrad)" rx="6"/>
    <!-- Access panels -->
    <rect x="10" y="10" width="76" height="120" fill="#4A6A86" rx="3" stroke="#2A4A62" stroke-width="1"/>
    <rect x="94" y="10" width="76" height="120" fill="#4A6A86" rx="3" stroke="#2A4A62" stroke-width="1"/>
    <!-- Handles -->
    <rect x="42" y="65" width="12" height="10" fill="#8AAAC2" rx="2"/>
    <rect x="126" y="65" width="12" height="10" fill="#8AAAC2" rx="2"/>
    <!-- Filter access panel -->
    <rect x="10" y="140" width="160" height="60" fill="#3A5A76" rx="3" stroke="#2A4A62" stroke-width="1"/>
    <text x="90" y="175" text-anchor="middle" fill="#A0BDD0" font-size="9" font-family="Arial, sans-serif">FILTER SECTION</text>
    <!-- Fan section -->
    <rect x="10" y="210" width="160" height="60" fill="#3A5A76" rx="3" stroke="#2A4A62" stroke-width="1"/>
    <circle cx="55" cy="240" r="22" fill="#2A4A62" stroke="#5A7A96" stroke-width="2"/>
    <circle cx="55" cy="240" r="14" fill="#1A3A5C"/>
    <circle cx="125" cy="240" r="22" fill="#2A4A62" stroke="#5A7A96" stroke-width="2"/>
    <circle cx="125" cy="240" r="14" fill="#1A3A5C"/>
    <!-- Nameplate -->
    <rect x="50" y="285" width="80" height="22" fill="#1A3A5C" rx="3"/>
    <text x="90" y="300" text-anchor="middle" fill="#E87B2A" font-size="9" font-family="Arial, sans-serif" font-weight="bold">AHU-1</text>
    <!-- Legs -->
    <rect x="20" y="395" width="16" height="80" fill="#2A4A62" rx="2"/>
    <rect x="144" y="395" width="16" height="80" fill="#2A4A62" rx="2"/>
  </g>

  <!-- Hydronic Boiler (center-left) -->
  <g transform="translate(280, 180)">
    <rect x="0" y="0" width="140" height="220" fill="#5A4A3A" rx="6"/>
    <rect x="10" y="10" width="120" height="80" fill="#6A5A4A" rx="4"/>
    <!-- Burner view window -->
    <circle cx="70" cy="50" r="28" fill="#3A2A1A" stroke="#8A7A6A" stroke-width="2"/>
    <circle cx="70" cy="50" r="20" fill="#FF8C00" opacity="0.6"/>
    <circle cx="70" cy="50" r="12" fill="#FFCC00" opacity="0.8"/>
    <!-- Controls panel -->
    <rect x="10" y="100" width="120" height="60" fill="#4A3A2A" rx="4"/>
    <circle cx="45" cy="120" r="8" fill="#E87B2A" stroke="#FF9A3A" stroke-width="1"/>
    <circle cx="70" cy="120" r="8" fill="#2ECC71" stroke="#3DE881" stroke-width="1"/>
    <circle cx="95" cy="120" r="8" fill="#3498DB" stroke="#55A8EB" stroke-width="1"/>
    <rect x="20" y="138" width="80" height="12" fill="#2A1A0A" rx="2"/>
    <!-- Flue pipe -->
    <rect x="55" y="-60" width="30" height="70" fill="#6A6A6A" rx="4"/>
    <ellipse cx="70" cy="-60" rx="15" ry="6" fill="#5A5A5A"/>
    <!-- Nameplate -->
    <rect x="35" y="170" width="70" height="20" fill="#1A3A5C" rx="3"/>
    <text x="70" y="184" text-anchor="middle" fill="#E87B2A" font-size="9" font-family="Arial, sans-serif" font-weight="bold">BOILER-1</text>
    <!-- Legs -->
    <rect x="15" y="216" width="14" height="50" fill="#3A3A3A" rx="2"/>
    <rect x="111" y="216" width="14" height="50" fill="#3A3A3A" rx="2"/>
  </g>

  <!-- Chiller unit (center-right) -->
  <g transform="translate(480, 150)">
    <rect x="0" y="0" width="200" height="250" fill="url(#equipGrad)" rx="6"/>
    <!-- Condenser coils top -->
    <rect x="10" y="10" width="180" height="60" fill="#3A5A76" rx="4"/>
    <line x1="25" y1="20" x2="25" y2="60" stroke="#5A7A96" stroke-width="3"/>
    <line x1="45" y1="20" x2="45" y2="60" stroke="#5A7A96" stroke-width="3"/>
    <line x1="65" y1="20" x2="65" y2="60" stroke="#5A7A96" stroke-width="3"/>
    <line x1="85" y1="20" x2="85" y2="60" stroke="#5A7A96" stroke-width="3"/>
    <line x1="105" y1="20" x2="105" y2="60" stroke="#5A7A96" stroke-width="3"/>
    <line x1="125" y1="20" x2="125" y2="60" stroke="#5A7A96" stroke-width="3"/>
    <line x1="145" y1="20" x2="145" y2="60" stroke="#5A7A96" stroke-width="3"/>
    <line x1="165" y1="20" x2="165" y2="60" stroke="#5A7A96" stroke-width="3"/>
    <!-- Compressor section -->
    <rect x="10" y="80" width="80" height="100" fill="#2A4A62" rx="4"/>
    <circle cx="50" cy="130" r="30" fill="#1A3A5C" stroke="#3A5A76" stroke-width="3"/>
    <circle cx="50" cy="130" r="18" fill="#0A2A4C"/>
    <rect x="100" y="80" width="90" height="100" fill="#2A4A62" rx="4"/>
    <rect x="110" y="92" width="70" height="76" fill="#1A3A5C" rx="3"/>
    <!-- Gauges -->
    <circle cx="130" cy="116" r="14" fill="#0A2A4C" stroke="#5A7A96" stroke-width="2"/>
    <line x1="130" y1="110" x2="137" y2="118" stroke="#E87B2A" stroke-width="2"/>
    <circle cx="160" cy="116" r="14" fill="#0A2A4C" stroke="#5A7A96" stroke-width="2"/>
    <line x1="160" y1="107" x2="163" y2="116" stroke="#2ECC71" stroke-width="2"/>
    <!-- Control panel -->
    <rect x="10" y="190" width="180" height="50" fill="#1A3A5C" rx="4"/>
    <rect x="20" y="200" width="100" height="30" fill="#0A1A2C" rx="2"/>
    <rect x="25" y="205" width="40" height="10" fill="#2ECC71" opacity="0.8" rx="1"/>
    <rect x="70" y="205" width="40" height="10" fill="#E87B2A" opacity="0.8" rx="1"/>
    <circle cx="145" cy="210" r="8" fill="#2ECC71"/>
    <circle cx="165" cy="210" r="8" fill="#3498DB"/>
    <!-- Nameplate -->
    <rect x="60" y="250" width="80" height="22" fill="#1A3A5C" rx="3"/>
    <text x="100" y="265" text-anchor="middle" fill="#E87B2A" font-size="9" font-family="Arial, sans-serif" font-weight="bold">CHILLER-1</text>
    <!-- Legs -->
    <rect x="20" y="368" width="14" height="108" fill="#2A4A62" rx="2"/>
    <rect x="166" y="368" width="14" height="108" fill="#2A4A62" rx="2"/>
  </g>

  <!-- Pump skid (right) -->
  <g transform="translate(740, 280)">
    <rect x="0" y="60" width="120" height="150" fill="#4A4A4A" rx="4"/>
    <!-- Pumps -->
    <circle cx="35" cy="95" r="28" fill="#3A3A3A" stroke="#6A6A6A" stroke-width="3"/>
    <circle cx="35" cy="95" r="16" fill="#2A2A2A"/>
    <circle cx="85" cy="95" r="28" fill="#3A3A3A" stroke="#6A6A6A" stroke-width="3"/>
    <circle cx="85" cy="95" r="16" fill="#2A2A2A"/>
    <!-- Motors -->
    <rect x="10" y="130" width="50" height="30" fill="#5A5A5A" rx="3"/>
    <rect x="60" y="130" width="50" height="30" fill="#5A5A5A" rx="3"/>
    <!-- Nameplate -->
    <rect x="20" y="175" width="80" height="20" fill="#1A3A5C" rx="3"/>
    <text x="60" y="189" text-anchor="middle" fill="#E87B2A" font-size="9" font-family="Arial, sans-serif" font-weight="bold">HW PUMPS</text>
  </g>

  <!-- Piping runs (horizontal) -->
  <!-- Hot water supply (red) -->
  <rect x="220" y="200" width="520" height="14" fill="url(#pipeHot)" rx="3"/>
  <text x="230" y="196" fill="#C0392B" font-size="9" font-family="Arial, sans-serif" font-weight="bold">HWS 4"</text>
  <!-- Hot water return (darker red) -->
  <rect x="220" y="225" width="520" height="14" fill="#A93226" rx="3"/>
  <text x="230" y="248" fill="#922B21" font-size="9" font-family="Arial, sans-serif" font-weight="bold">HWR 4"</text>
  <!-- Chilled water supply (blue) -->
  <rect x="220" y="270" width="260" height="14" fill="url(#pipeCold)" rx="3"/>
  <text x="222" y="266" fill="#2980B9" font-size="9" font-family="Arial, sans-serif" font-weight="bold">CHWS 3"</text>
  <!-- Chilled water return (darker blue) -->
  <rect x="220" y="295" width="260" height="14" fill="#1A6090" rx="3"/>
  <text x="222" y="320" fill="#154360" font-size="9" font-family="Arial, sans-serif" font-weight="bold">CHWR 3"</text>

  <!-- Pipe labels / tags -->
  <g transform="translate(440, 192)">
    <rect x="-2" y="-2" width="36" height="16" fill="#1A3A5C" rx="2"/>
    <text x="16" y="10" text-anchor="middle" fill="white" font-size="7" font-family="Arial, sans-serif">V-12</text>
  </g>

  <!-- Valves on pipes -->
  <rect x="350" y="197" width="20" height="20" fill="#E87B2A" rx="2"/>
  <rect x="450" y="197" width="20" height="20" fill="#E87B2A" rx="2"/>
  <rect x="350" y="267" width="20" height="20" fill="#3498DB" rx="2"/>

  <!-- Electrical panel (far right wall) -->
  <g transform="translate(840, 100)">
    <rect x="0" y="0" width="50" height="280" fill="#4A4A5A" rx="4"/>
    <rect x="5" y="10" width="40" height="260" fill="#3A3A4A" rx="3"/>
    <!-- Breakers -->
    <rect x="9" y="16" width="14" height="8" fill="#E87B2A" rx="1"/>
    <rect x="27" y="16" width="14" height="8" fill="#E87B2A" rx="1"/>
    <rect x="9" y="30" width="14" height="8" fill="#5A7A96" rx="1"/>
    <rect x="27" y="30" width="14" height="8" fill="#5A7A96" rx="1"/>
    <rect x="9" y="44" width="14" height="8" fill="#5A7A96" rx="1"/>
    <rect x="27" y="44" width="14" height="8" fill="#5A7A96" rx="1"/>
    <rect x="9" y="58" width="14" height="8" fill="#5A7A96" rx="1"/>
    <rect x="27" y="58" width="14" height="8" fill="#5A7A96" rx="1"/>
    <rect x="9" y="72" width="14" height="8" fill="#5A7A96" rx="1"/>
    <rect x="27" y="72" width="14" height="8" fill="#5A7A96" rx="1"/>
    <rect x="9" y="86" width="14" height="8" fill="#2ECC71" rx="1"/>
    <text x="25" y="180" text-anchor="middle" fill="#8A8AAA" font-size="8" font-family="Arial, sans-serif" transform="rotate(90, 25, 180)">MDP-MECH</text>
  </g>

  <!-- Floor drain -->
  <ellipse cx="600" cy="500" rx="20" ry="10" fill="#5A6570" stroke="#4A5560" stroke-width="2"/>
  <ellipse cx="600" cy="500" rx="14" ry="7" fill="#4A5560"/>

  <!-- Label -->
  <rect x="20" y="540" width="260" height="42" fill="#1A3A5C" opacity="0.9" rx="6"/>
  <text x="30" y="560" fill="white" font-size="14" font-family="Arial, sans-serif" font-weight="bold">Mechanical Room</text>
  <text x="30" y="576" fill="#E87B2A" font-size="10" font-family="Arial, sans-serif">Commercial HVAC • Central Plant</text>
</svg>
