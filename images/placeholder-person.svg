<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" role="img" aria-label="Team member photo placeholder">
  <!-- Background -->
  <rect width="300" height="300" fill="#E8EDF5"/>

  <!-- Subtle grid pattern -->
  <line x1="0" y1="50" x2="300" y2="50" stroke="#D8DDE8" stroke-width="1"/>
  <line x1="0" y1="100" x2="300" y2="100" stroke="#D8DDE8" stroke-width="1"/>
  <line x1="0" y1="150" x2="300" y2="150" stroke="#D8DDE8" stroke-width="1"/>
  <line x1="0" y1="200" x2="300" y2="200" stroke="#D8DDE8" stroke-width="1"/>
  <line x1="0" y1="250" x2="300" y2="250" stroke="#D8DDE8" stroke-width="1"/>
  <line x1="50" y1="0" x2="50" y2="300" stroke="#D8DDE8" stroke-width="1"/>
  <line x1="100" y1="0" x2="100" y2="300" stroke="#D8DDE8" stroke-width="1"/>
  <line x1="150" y1="0" x2="150" y2="300" stroke="#D8DDE8" stroke-width="1"/>
  <line x1="200" y1="0" x2="200" y2="300" stroke="#D8DDE8" stroke-width="1"/>
  <line x1="250" y1="0" x2="250" y2="300" stroke="#D8DDE8" stroke-width="1"/>

  <!-- Person silhouette -->
  <!-- Head -->
  <circle cx="150" cy="95" r="52" fill="#B0BBCA"/>
  <!-- Shoulders / body -->
  <ellipse cx="150" cy="230" rx="90" ry="70" fill="#B0BBCA"/>

  <!-- Navy collar detail -->
  <polygon points="150,148 120,200 180,200" fill="#1A3A5C" opacity="0.5"/>

  <!-- Orange accent dot (brand touch) -->
  <circle cx="150" cy="95" r="3" fill="#E87B2A" opacity="0"/>

  <!-- Label at bottom -->
  <rect x="0" y="270" width="300" height="30" fill="#1A3A5C" opacity="0.8"/>
  <text x="150" y="290" text-anchor="middle" fill="white" font-size="11" font-family="Arial, sans-serif">Team Member Photo</text>
</svg>
