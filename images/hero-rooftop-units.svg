<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-label="Commercial rooftop HVAC units">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B8D4E8"/>
      <stop offset="100%" stop-color="#D9EAF5"/>
    </linearGradient>
    <linearGradient id="roofGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4A6580"/>
      <stop offset="100%" stop-color="#2E4A62"/>
    </linearGradient>
    <linearGradient id="unitGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8AA8C0"/>
      <stop offset="100%" stop-color="#5A7A96"/>
    </linearGradient>
  </defs>

  <!-- Sky background -->
  <rect width="1200" height="600" fill="url(#skyGrad)"/>

  <!-- Distant city silhouette -->
  <rect x="0" y="340" width="1200" height="8" fill="#C5D9E8" opacity="0.6"/>
  <rect x="50" y="290" width="60" height="58" fill="#C5D9E8" opacity="0.5"/>
  <rect x="140" y="310" width="40" height="38" fill="#C5D9E8" opacity="0.5"/>
  <rect x="200" y="270" width="80" height="78" fill="#C5D9E8" opacity="0.5"/>
  <rect x="950" y="285" width="70" height="63" fill="#C5D9E8" opacity="0.5"/>
  <rect x="1050" y="300" width="50" height="48" fill="#C5D9E8" opacity="0.5"/>
  <rect x="1110" y="280" width="90" height="68" fill="#C5D9E8" opacity="0.5"/>

  <!-- Roof surface -->
  <rect x="0" y="360" width="1200" height="240" fill="url(#roofGrad)"/>

  <!-- Roof surface texture lines -->
  <line x1="0" y1="380" x2="1200" y2="380" stroke="#3A5A76" stroke-width="1" opacity="0.4"/>
  <line x1="0" y1="400" x2="1200" y2="400" stroke="#3A5A76" stroke-width="1" opacity="0.4"/>
  <line x1="0" y1="420" x2="1200" y2="420" stroke="#3A5A76" stroke-width="1" opacity="0.3"/>
  <line x1="0" y1="450" x2="1200" y2="450" stroke="#3A5A76" stroke-width="1" opacity="0.3"/>

  <!-- RTU 1 (large, left) -->
  <g transform="translate(140, 200)">
    <!-- Base frame -->
    <rect x="0" y="80" width="200" height="100" fill="url(#unitGrad)" rx="4"/>
    <!-- Body -->
    <rect x="0" y="0" width="200" height="90" fill="#6A8FA8" rx="4"/>
    <!-- Top panel -->
    <rect x="10" y="10" width="180" height="30" fill="#5A7F9A" rx="2"/>
    <!-- Fan grilles -->
    <circle cx="60" cy="50" r="25" fill="#4A6F8A" stroke="#3A5F7A" stroke-width="2"/>
    <circle cx="60" cy="50" r="18" fill="#3A5F7A"/>
    <circle cx="140" cy="50" r="25" fill="#4A6F8A" stroke="#3A5F7A" stroke-width="2"/>
    <circle cx="140" cy="50" r="18" fill="#3A5F7A"/>
    <!-- Fan blades -->
    <line x1="60" y1="35" x2="60" y2="65" stroke="#6A8FA8" stroke-width="3"/>
    <line x1="45" y1="50" x2="75" y2="50" stroke="#6A8FA8" stroke-width="3"/>
    <line x1="49" y1="39" x2="71" y2="61" stroke="#6A8FA8" stroke-width="2"/>
    <line x1="49" y1="61" x2="71" y2="39" stroke="#6A8FA8" stroke-width="2"/>
    <line x1="140" y1="35" x2="140" y2="65" stroke="#6A8FA8" stroke-width="3"/>
    <line x1="125" y1="50" x2="155" y2="50" stroke="#6A8FA8" stroke-width="3"/>
    <line x1="129" y1="39" x2="151" y2="61" stroke="#6A8FA8" stroke-width="2"/>
    <line x1="129" y1="61" x2="151" y2="39" stroke="#6A8FA8" stroke-width="2"/>
    <!-- Duct connections -->
    <rect x="30" y="170" width="50" height="20" fill="#4A6580" rx="2"/>
    <rect x="120" y="170" width="50" height="20" fill="#4A6580" rx="2"/>
    <!-- Brand plate -->
    <rect x="70" y="92" width="60" height="16" fill="#1A3A5C" rx="2"/>
    <text x="100" y="104" text-anchor="middle" fill="#E87B2A" font-size="8" font-family="Arial, sans-serif" font-weight="bold">RTU-1</text>
  </g>

  <!-- RTU 2 (medium, center-left) -->
  <g transform="translate(420, 230)">
    <rect x="0" y="60" width="160" height="80" fill="url(#unitGrad)" rx="4"/>
    <rect x="0" y="0" width="160" height="70" fill="#6A8FA8" rx="4"/>
    <rect x="8" y="8" width="144" height="24" fill="#5A7F9A" rx="2"/>
    <circle cx="50" cy="38" r="22" fill="#4A6F8A" stroke="#3A5F7A" stroke-width="2"/>
    <circle cx="50" cy="38" r="15" fill="#3A5F7A"/>
    <circle cx="110" cy="38" r="22" fill="#4A6F8A" stroke="#3A5F7A" stroke-width="2"/>
    <circle cx="110" cy="38" r="15" fill="#3A5F7A"/>
    <line x1="50" y1="25" x2="50" y2="51" stroke="#6A8FA8" stroke-width="2"/>
    <line x1="37" y1="38" x2="63" y2="38" stroke="#6A8FA8" stroke-width="2"/>
    <line x1="110" y1="25" x2="110" y2="51" stroke="#6A8FA8" stroke-width="2"/>
    <line x1="97" y1="38" x2="123" y2="38" stroke="#6A8FA8" stroke-width="2"/>
    <rect x="50" y="72" width="60" height="14" fill="#1A3A5C" rx="2"/>
    <text x="80" y="83" text-anchor="middle" fill="#E87B2A" font-size="7" font-family="Arial, sans-serif" font-weight="bold">RTU-2</text>
    <rect x="20" y="132" width="40" height="16" fill="#4A6580" rx="2"/>
    <rect x="100" y="132" width="40" height="16" fill="#4A6580" rx="2"/>
  </g>

  <!-- RTU 3 (large, center) -->
  <g transform="translate(650, 190)">
    <rect x="0" y="90" width="220" height="110" fill="url(#unitGrad)" rx="4"/>
    <rect x="0" y="0" width="220" height="100" fill="#6A8FA8" rx="4"/>
    <rect x="10" y="10" width="200" height="32" fill="#5A7F9A" rx="2"/>
    <circle cx="65" cy="58" r="28" fill="#4A6F8A" stroke="#3A5F7A" stroke-width="2"/>
    <circle cx="65" cy="58" r="20" fill="#3A5F7A"/>
    <circle cx="155" cy="58" r="28" fill="#4A6F8A" stroke="#3A5F7A" stroke-width="2"/>
    <circle cx="155" cy="58" r="20" fill="#3A5F7A"/>
    <line x1="65" y1="40" x2="65" y2="76" stroke="#6A8FA8" stroke-width="3"/>
    <line x1="47" y1="58" x2="83" y2="58" stroke="#6A8FA8" stroke-width="3"/>
    <line x1="52" y1="45" x2="78" y2="71" stroke="#6A8FA8" stroke-width="2"/>
    <line x1="52" y1="71" x2="78" y2="45" stroke="#6A8FA8" stroke-width="2"/>
    <line x1="155" y1="40" x2="155" y2="76" stroke="#6A8FA8" stroke-width="3"/>
    <line x1="137" y1="58" x2="173" y2="58" stroke="#6A8FA8" stroke-width="3"/>
    <line x1="142" y1="45" x2="168" y2="71" stroke="#6A8FA8" stroke-width="2"/>
    <line x1="142" y1="71" x2="168" y2="45" stroke="#6A8FA8" stroke-width="2"/>
    <rect x="80" y="102" width="60" height="16" fill="#1A3A5C" rx="2"/>
    <text x="110" y="114" text-anchor="middle" fill="#E87B2A" font-size="8" font-family="Arial, sans-serif" font-weight="bold">RTU-3</text>
    <rect x="30" y="192" width="55" height="20" fill="#4A6580" rx="2"/>
    <rect x="135" y="192" width="55" height="20" fill="#4A6580" rx="2"/>
  </g>

  <!-- Small condenser unit right -->
  <g transform="translate(960, 260)">
    <rect x="0" y="50" width="120" height="70" fill="url(#unitGrad)" rx="4"/>
    <rect x="0" y="0" width="120" height="60" fill="#6A8FA8" rx="4"/>
    <circle cx="40" cy="30" r="20" fill="#4A6F8A" stroke="#3A5F7A" stroke-width="2"/>
    <circle cx="40" cy="30" r="14" fill="#3A5F7A"/>
    <circle cx="85" cy="30" r="20" fill="#4A6F8A" stroke="#3A5F7A" stroke-width="2"/>
    <circle cx="85" cy="30" r="14" fill="#3A5F7A"/>
    <rect x="35" y="56" width="50" height="12" fill="#1A3A5C" rx="2"/>
    <text x="60" y="66" text-anchor="middle" fill="#E87B2A" font-size="7" font-family="Arial, sans-serif" font-weight="bold">COND-4</text>
  </g>

  <!-- Pipes and conduit on roof -->
  <rect x="340" y="375" width="8" height="60" fill="#3A5A70" rx="2"/>
  <rect x="340" y="373" width="60" height="8" fill="#3A5A70" rx="2"/>
  <rect x="393" y="373" width="8" height="30" fill="#3A5A70" rx="2"/>

  <rect x="620" y="375" width="8" height="55" fill="#3A5A70" rx="2"/>
  <rect x="620" y="373" width="80" height="8" fill="#3A5A70" rx="2"/>
  <rect x="692" y="373" width="8" height="35" fill="#3A5A70" rx="2"/>

  <!-- Curb/parapet edge -->
  <rect x="0" y="356" width="1200" height="12" fill="#3A5A70" rx="0"/>
  <rect x="0" y="350" width="1200" height="8" fill="#2A4A60"/>

  <!-- Label overlay -->
  <rect x="20" y="20" width="360" height="60" fill="#1A3A5C" opacity="0.85" rx="6"/>
  <text x="40" y="46" fill="white" font-size="18" font-family="Arial, sans-serif" font-weight="bold">Commercial Rooftop Units</text>
  <text x="40" y="68" fill="#E87B2A" font-size="12" font-family="Arial, sans-serif">Henderson, NV • Commercial Installation</text>
</svg>
