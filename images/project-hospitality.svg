<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Hotel building with commercial HVAC systems">
  <defs>
    <linearGradient id="skyH" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C8D8E8"/>
      <stop offset="100%" stop-color="#E0EEF8"/>
    </linearGradient>
    <linearGradient id="hotelBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8E0D0"/>
      <stop offset="100%" stop-color="#C8C0B0"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#skyH)"/>

  <!-- Ground / landscaping -->
  <rect x="0" y="430" width="800" height="70" fill="#7A8A6A"/>
  <rect x="0" y="428" width="800" height="6" fill="#6A7A5A"/>

  <!-- Drive / entrance paving -->
  <rect x="280" y="428" width="240" height="72" fill="#9A9898"/>

  <!-- Building base -->
  <rect x="100" y="220" width="600" height="210" fill="#D8D0C0"/>

  <!-- Hotel tower -->
  <rect x="220" y="80" width="360" height="350" fill="url(#hotelBody)"/>
  <rect x="220" y="78" width="360" height="8" fill="#B8B0A0" rx="2"/>

  <!-- Hotel name band at top -->
  <rect x="220" y="80" width="360" height="28" fill="#1A3A5C"/>
  <text x="400" y="99" text-anchor="middle" fill="white" font-size="13" font-family="Arial, sans-serif" font-weight="bold" letter-spacing="2">GRAND SUITES HOTEL</text>

  <!-- Window grid (hotel floors) -->
  <!-- Floor 1 -->
  <rect x="236" y="118" width="36" height="24" fill="#B8CCE0" stroke="#A8BCD0" stroke-width="1" rx="1"/>
  <rect x="282" y="118" width="36" height="24" fill="#B8CCE0" stroke="#A8BCD0" stroke-width="1" rx="1"/>
  <rect x="328" y="118" width="36" height="24" fill="#D8C8A0" stroke="#A8BCD0" stroke-width="1" rx="1"/>
  <rect x="374" y="118" width="36" height="24" fill="#B8CCE0" stroke="#A8BCD0" stroke-width="1" rx="1"/>
  <rect x="420" y="118" width="36" height="24" fill="#B8CCE0" stroke="#A8BCD0" stroke-width="1" rx="1"/>
  <rect x="466" y="118" width="36" height="24" fill="#B8CCE0" stroke="#A8BCD0" stroke-width="1" rx="1"/>
  <rect x="512" y="118" width="36" height="24" fill="#B8CCE0" stroke="#A8BCD0" stroke-width="1" rx="1"/>
  <!-- Floor 2 -->
  <rect x="236" y="152" width="36" height="24" fill="#B8CCE0" stroke="#A8BCD0" stroke-width="1" rx="1"/>
  <rect x="282" y="152" width="36" height="24" fill="#D8C8A0" stroke="#A8BCD0" stroke-width="1" rx="1"/>
  <rect x="328" y="152" width="36" height="24" fill="#B8CCE0" stroke="#A8BCD0" stroke-width="1" rx="1"/>
  <rect x="374" y="152" width="36" height="24" fill="#B8CCE0" stroke="#A8BCD0" stroke-width="1" rx="1"/>
  <rect x="420" y="152" width="36" height="24" fill="#D8C8A0" stroke="#A8BCD0" stroke-width="1" rx="1"/>
  <rect x="466" y="152" width="36" height="24" fill="#B8CCE0" stroke="#A8BCD0" stroke-width="1" rx="1"/>
  <rect x="512" y="152" width="36" height="24" fill="#B8CCE0" stroke="#A8BCD0" stroke-width="1" rx="1"/>
  <!-- Floor 3 -->
  <rect x="236" y="186" width="36" height="24" fill="#D8C8A0" stroke="#A8BCD0" stroke-width="1" rx="1"/>
  <rect x="282" y="186" width="36" height="24" fill="#B8CCE0" stroke="#A8BCD0" stroke-width="1" rx="1"/>
  <rect x="328" y="186" width="36" height="24" fill="#B8CCE0" stroke="#A8BCD0" stroke-width="1" rx="1"/>
  <rect x="374" y="186" width="36" height="24" fill="#B8CCE0" stroke="#A8BCD0" stroke-width="1" rx="1"/>
  <rect x="420" y="186" width="36" height="24" fill="#B8CCE0" stroke="#A8BCD0" stroke-width="1" rx="1"/>
  <rect x="466" y="186" width="36" height="24" fill="#D8C8A0" stroke="#A8BCD0" stroke-width="1" rx="1"/>
  <rect x="512" y="186" width="36" height="24" fill="#B8CCE0" stroke="#A8BCD0" stroke-width="1" rx="1"/>
  <!-- Floor 4 -->
  <rect x="236" y="220" width="36" height="24" fill="#B8CCE0" stroke="#A8BCD0" stroke-width="1" rx="1"/>
  <rect x="282" y="220" width="36" height="24" fill="#B8CCE0" stroke="#A8BCD0" stroke-width="1" rx="1"/>
  <rect x="328" y="220" width="36" height="24" fill="#B8CCE0" stroke="#A8BCD0" stroke-width="1" rx="1"/>
  <rect x="374" y="220" width="36" height="24" fill="#D8C8A0" stroke="#A8BCD0" stroke-width="1" rx="1"/>
  <rect x="420" y="220" width="36" height="24" fill="#B8CCE0" stroke="#A8BCD0" stroke-width="1" rx="1"/>
  <rect x="466" y="220" width="36" height="24" fill="#B8CCE0" stroke="#A8BCD0" stroke-width="1" rx="1"/>
  <rect x="512" y="220" width="36" height="24" fill="#B8CCE0" stroke="#A8BCD0" stroke-width="1" rx="1"/>

  <!-- Lobby entrance -->
  <rect x="300" y="330" width="200" height="100" fill="#C8E0F0" stroke="#8AAAC2" stroke-width="2" rx="2"/>
  <line x1="400" y1="330" x2="400" y2="430" stroke="#8AAAC2" stroke-width="1.5"/>
  <rect x="295" y="318" width="210" height="16" fill="#1A3A5C" rx="2"/>

  <!-- Porte cochere -->
  <rect x="250" y="318" width="300" height="10" fill="#B8A880" rx="2"/>
  <rect x="255" y="328" width="6" height="72" fill="#B8A880" rx="2"/>
  <rect x="539" y="328" width="6" height="72" fill="#B8A880" rx="2"/>

  <!-- Cooling tower / rooftop equipment -->
  <rect x="240" y="52" width="70" height="32" fill="#5A7A96" rx="3"/>
  <rect x="248" y="45" width="54" height="10" fill="#4A6A86" rx="2"/>
  <circle cx="262" cy="68" r="12" fill="#3A5A76"/>
  <circle cx="294" cy="68" r="12" fill="#3A5A76"/>
  <text x="275" y="92" text-anchor="middle" fill="#1A3A5C" font-size="7" font-family="Arial, sans-serif" font-weight="bold">COOLING TWR</text>

  <rect x="450" y="52" width="90" height="32" fill="#5A7A96" rx="3"/>
  <rect x="458" y="45" width="74" height="10" fill="#4A6A86" rx="2"/>
  <circle cx="472" cy="68" r="12" fill="#3A5A76"/>
  <circle cx="504" cy="68" r="12" fill="#3A5A76"/>
  <circle cx="532" cy="68" r="11" fill="#3A5A76"/>
  <text x="495" y="92" text-anchor="middle" fill="#1A3A5C" font-size="7" font-family="Arial, sans-serif" font-weight="bold">CHILLER PLANT</text>

  <!-- Side wing buildings -->
  <rect x="100" y="280" width="120" height="150" fill="#D0C8B8"/>
  <rect x="100" y="278" width="120" height="8" fill="#B0A898"/>
  <rect x="580" y="280" width="120" height="150" fill="#D0C8B8"/>
  <rect x="580" y="278" width="120" height="8" fill="#B0A898"/>

  <!-- Caption -->
  <rect x="0" y="458" width="800" height="42" fill="#1A3A5C" opacity="0.9"/>
  <text x="20" y="476" fill="white" font-size="14" font-family="Arial, sans-serif" font-weight="bold">Hospitality — Hotel HVAC System</text>
  <text x="20" y="493" fill="#E87B2A" font-size="11" font-family="Arial, sans-serif">Chilled Water Plant • PTAC Units • Kitchen Exhaust • BAS</text>
  <text x="700" y="481" text-anchor="end" fill="#8AAAC2" font-size="11" font-family="Arial, sans-serif">Las Vegas, NV</text>
</svg>
