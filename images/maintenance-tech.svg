<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="HVAC technician performing maintenance">
  <defs>
    <linearGradient id="bgMaint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1A3A5C"/>
      <stop offset="100%" stop-color="#0A2040"/>
    </linearGradient>
    <linearGradient id="rtуMaint" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7A9AB5"/>
      <stop offset="100%" stop-color="#4A6A86"/>
    </linearGradient>
  </defs>

  <!-- Background (rooftop at dusk/morning) -->
  <rect width="800" height="500" fill="url(#bgMaint)"/>

  <!-- Sky gradient overlay -->
  <rect width="800" height="320" fill="#1A3050" opacity="0.5"/>

  <!-- Stars / distant lights -->
  <circle cx="100" cy="50" r="1.5" fill="white" opacity="0.6"/>
  <circle cx="180" cy="30" r="1" fill="white" opacity="0.5"/>
  <circle cx="250" cy="70" r="1.5" fill="white" opacity="0.7"/>
  <circle cx="350" cy="40" r="1" fill="white" opacity="0.4"/>
  <circle cx="500" cy="60" r="1.5" fill="white" opacity="0.6"/>
  <circle cx="620" cy="35" r="1" fill="white" opacity="0.5"/>
  <circle cx="720" cy="55" r="1.5" fill="white" opacity="0.7"/>

  <!-- Distant city skyline -->
  <rect x="0" y="230" width="80" height="90" fill="#0A1A30" opacity="0.8"/>
  <rect x="90" y="200" width="50" height="120" fill="#0A1A30" opacity="0.8"/>
  <rect x="150" y="215" width="40" height="105" fill="#0A1A30" opacity="0.8"/>
  <rect x="600" y="210" width="60" height="110" fill="#0A1A30" opacity="0.8"/>
  <rect x="670" y="195" width="80" height="125" fill="#0A1A30" opacity="0.8"/>
  <rect x="720" y="220" width="80" height="100" fill="#0A1A30" opacity="0.8"/>
  <!-- Building windows lit up -->
  <rect x="10" y="245" width="8" height="6" fill="#E8CC60" opacity="0.7"/>
  <rect x="24" y="245" width="8" height="6" fill="#E8CC60" opacity="0.7"/>
  <rect x="38" y="245" width="8" height="6" fill="white" opacity="0.5"/>
  <rect x="10" y="260" width="8" height="6" fill="white" opacity="0.3"/>
  <rect x="38" y="260" width="8" height="6" fill="#E8CC60" opacity="0.7"/>
  <rect x="96" y="218" width="8" height="6" fill="#E8CC60" opacity="0.6"/>
  <rect x="110" y="218" width="8" height="6" fill="white" opacity="0.4"/>
  <rect x="96" y="232" width="8" height="6" fill="white" opacity="0.5"/>
  <rect x="685" y="212" width="8" height="6" fill="#E8CC60" opacity="0.6"/>
  <rect x="699" y="212" width="8" height="6" fill="white" opacity="0.4"/>
  <rect x="685" y="226" width="8" height="6" fill="white" opacity="0.3"/>
  <rect x="699" y="226" width="8" height="6" fill="#E8CC60" opacity="0.6"/>

  <!-- Roof surface -->
  <rect x="0" y="320" width="800" height="180" fill="#2A3A4A"/>
  <rect x="0" y="318" width="800" height="6" fill="#1A2A3A"/>
  <!-- Roof membrane seams -->
  <line x1="0" y1="345" x2="800" y2="345" stroke="#202E3E" stroke-width="2" opacity="0.7"/>
  <line x1="0" y1="375" x2="800" y2="375" stroke="#202E3E" stroke-width="2" opacity="0.7"/>
  <line x1="0" y1="405" x2="800" y2="405" stroke="#202E3E" stroke-width="2" opacity="0.7"/>
  <line x1="0" y1="435" x2="800" y2="435" stroke="#202E3E" stroke-width="2" opacity="0.7"/>
  <line x1="200" y1="318" x2="200" y2="500" stroke="#202E3E" stroke-width="2" opacity="0.5"/>
  <line x1="400" y1="318" x2="400" y2="500" stroke="#202E3E" stroke-width="2" opacity="0.5"/>
  <line x1="600" y1="318" x2="600" y2="500" stroke="#202E3E" stroke-width="2" opacity="0.5"/>

  <!-- RTU unit being serviced -->
  <g transform="translate(300, 140)">
    <!-- Housing -->
    <rect x="0" y="0" width="280" height="185" fill="url(#rtуMaint)" rx="6"/>
    <rect x="0" y="0" width="280" height="18" fill="#8AAAC2" rx="6"/>
    <rect x="0" y="12" width="280" height="8" fill="#6A8AA8"/>

    <!-- Fan section -->
    <rect x="10" y="22" width="125" height="90" fill="#3A5A76" rx="4"/>
    <circle cx="52" cy="67" r="38" fill="#2A4A66" stroke="#5A7A96" stroke-width="3"/>
    <circle cx="52" cy="67" r="26" fill="#1A3A56"/>
    <!-- Fan blades spinning -->
    <line x1="52" y1="38" x2="52" y2="96" stroke="#4A6A86" stroke-width="5"/>
    <line x1="23" y1="67" x2="81" y2="67" stroke="#4A6A86" stroke-width="5"/>
    <line x1="31" y1="46" x2="73" y2="88" stroke="#4A6A86" stroke-width="4"/>
    <line x1="31" y1="88" x2="73" y2="46" stroke="#4A6A86" stroke-width="4"/>
    <circle cx="115" cy="67" r="30" fill="#2A4A66" stroke="#5A7A96" stroke-width="2"/>
    <circle cx="115" cy="67" r="20" fill="#1A3A56"/>
    <line x1="115" y1="44" x2="115" y2="90" stroke="#4A6A86" stroke-width="4"/>
    <line x1="92" y1="67" x2="138" y2="67" stroke="#4A6A86" stroke-width="4"/>

    <!-- Coil section (open for service) -->
    <rect x="145" y="22" width="125" height="90" fill="#3A5A76" rx="4" stroke="#E87B2A" stroke-width="2" stroke-dasharray="6,3"/>
    <text x="207" y="45" text-anchor="middle" fill="#E87B2A" font-size="9" font-family="Arial, sans-serif" font-weight="bold">COIL ACCESS</text>
    <text x="207" y="58" text-anchor="middle" fill="#E87B2A" font-size="8" font-family="Arial, sans-serif">PANEL OPEN</text>
    <!-- Coil fins visible -->
    <line x1="152" y1="64" x2="152" y2="104" stroke="#5A7A96" stroke-width="2"/>
    <line x1="160" y1="64" x2="160" y2="104" stroke="#5A7A96" stroke-width="2"/>
    <line x1="168" y1="64" x2="168" y2="104" stroke="#5A7A96" stroke-width="2"/>
    <line x1="176" y1="64" x2="176" y2="104" stroke="#5A7A96" stroke-width="2"/>
    <line x1="184" y1="64" x2="184" y2="104" stroke="#5A7A96" stroke-width="2"/>
    <line x1="192" y1="64" x2="192" y2="104" stroke="#5A7A96" stroke-width="2"/>
    <line x1="200" y1="64" x2="200" y2="104" stroke="#5A7A96" stroke-width="2"/>
    <line x1="208" y1="64" x2="208" y2="104" stroke="#5A7A96" stroke-width="2"/>
    <line x1="216" y1="64" x2="216" y2="104" stroke="#5A7A96" stroke-width="2"/>
    <line x1="224" y1="64" x2="224" y2="104" stroke="#5A7A96" stroke-width="2"/>
    <line x1="232" y1="64" x2="232" y2="104" stroke="#5A7A96" stroke-width="2"/>
    <line x1="240" y1="64" x2="240" y2="104" stroke="#5A7A96" stroke-width="2"/>
    <line x1="248" y1="64" x2="248" y2="104" stroke="#5A7A96" stroke-width="2"/>
    <line x1="256" y1="64" x2="256" y2="104" stroke="#5A7A96" stroke-width="2"/>
    <line x1="264" y1="64" x2="264" y2="104" stroke="#5A7A96" stroke-width="2"/>

    <!-- Controls panel -->
    <rect x="10" y="122" width="260" height="54" fill="#1A3050" rx="4"/>
    <rect x="18" y="130" width="120" height="38" fill="#0A1A2C" rx="3"/>
    <text x="78" y="144" text-anchor="middle" fill="#2ECC71" font-size="8" font-family="monospace">SUPPLY: 55°F</text>
    <text x="78" y="156" text-anchor="middle" fill="#E87B2A" font-size="8" font-family="monospace">HI PRESS: 285</text>
    <text x="78" y="164" text-anchor="middle" fill="#90D0FF" font-size="7" font-family="monospace">LO PRESS: 70</text>
    <circle cx="162" cy="144" r="8" fill="#2ECC71"/>
    <circle cx="182" cy="144" r="8" fill="#2ECC71"/>
    <circle cx="202" cy="144" r="8" fill="#E8E040"/>
    <circle cx="222" cy="144" r="8" fill="#2ECC71"/>
    <rect x="155" y="156" width="100" height="10" fill="#0A1A2C" rx="2"/>
    <text x="205" y="164" text-anchor="middle" fill="#E87B2A" font-size="7" font-family="monospace">PM SCHED OK</text>

    <!-- Nameplate -->
    <rect x="90" y="176" width="100" height="16" fill="#0A2040" rx="3"/>
    <text x="140" y="188" text-anchor="middle" fill="#E87B2A" font-size="8" font-family="Arial, sans-serif" font-weight="bold">RTU-7 • 25 TON</text>
  </g>

  <!-- Technician figure (working on unit) -->
  <g transform="translate(595, 245)">
    <!-- Body in work uniform -->
    <rect x="15" y="40" width="50" height="80" fill="#E87B2A" rx="4"/>
    <!-- Head -->
    <circle cx="40" cy="28" r="22" fill="#C09070"/>
    <!-- Hard hat (yellow) -->
    <ellipse cx="40" cy="12" rx="24" ry="11" fill="#E8E040"/>
    <rect x="16" y="20" width="48" height="7" fill="#E8E040"/>
    <!-- Safety vest reflective stripes -->
    <rect x="15" y="55" width="50" height="7" fill="#E8E040" opacity="0.8"/>
    <rect x="15" y="90" width="50" height="7" fill="#E8E040" opacity="0.8"/>
    <!-- Right arm holding gauge -->
    <rect x="63" y="42" width="14" height="50" fill="#E87B2A" rx="4"/>
    <!-- Manifold gauge set -->
    <rect x="74" y="50" width="50" height="60" fill="#2A2A2A" rx="4"/>
    <!-- Gauge faces -->
    <circle cx="91" cy="70" r="16" fill="#1A1A1A" stroke="#5A5A5A" stroke-width="2"/>
    <circle cx="91" cy="70" r="11" fill="#0A0A1A"/>
    <line x1="91" y1="62" x2="96" y2="70" stroke="#CC2222" stroke-width="2"/>
    <text x="91" y="90" text-anchor="middle" fill="#CC2222" font-size="6" font-family="monospace">HI</text>
    <circle cx="117" cy="70" r="16" fill="#1A1A1A" stroke="#5A5A5A" stroke-width="2"/>
    <circle cx="117" cy="70" r="11" fill="#0A0A1A"/>
    <line x1="117" y1="62" x2="120" y2="70" stroke="#3498DB" stroke-width="2"/>
    <text x="117" y="90" text-anchor="middle" fill="#3498DB" font-size="6" font-family="monospace">LO</text>
    <!-- Refrigerant hoses -->
    <path d="M 91 86 Q 60 110 40 130" stroke="#CC2222" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M 117 86 Q 130 110 150 120" stroke="#3498DB" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M 104 106 Q 110 130 120 140" stroke="#E8E040" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- Left arm -->
    <rect x="1" y="42" width="16" height="50" fill="#E87B2A" rx="4"/>
    <!-- Clipboard in left hand -->
    <rect x="-28" y="58" width="32" height="44" fill="#D0C0A0" rx="3"/>
    <rect x="-24" y="53" width="24" height="8" fill="#A0907A" rx="2"/>
    <!-- Checklist marks -->
    <line x1="-20" y1="70" x2="-14" y2="76" stroke="#1A3A5C" stroke-width="2"/>
    <line x1="-14" y1="76" x2="-6" y2="66" stroke="#1A3A5C" stroke-width="2"/>
    <line x1="-20" y1="80" x2="-14" y2="86" stroke="#1A3A5C" stroke-width="2"/>
    <line x1="-14" y1="86" x2="-6" y2="76" stroke="#1A3A5C" stroke-width="2"/>
    <rect x="-20" y="88" width="28" height="4" fill="#9A9898" rx="1"/>
    <rect x="-20" y="95" width="20" height="4" fill="#9A9898" rx="1"/>
    <!-- Legs -->
    <rect x="17" y="118" width="18" height="60" fill="#3A4A5A" rx="3"/>
    <rect x="39" y="118" width="18" height="60" fill="#3A4A5A" rx="3"/>
    <!-- Boots -->
    <rect x="14" y="172" width="24" height="14" fill="#2A2A2A" rx="2"/>
    <rect x="36" y="172" width="24" height="14" fill="#2A2A2A" rx="2"/>
  </g>

  <!-- Tool bag on roof -->
  <g transform="translate(100, 350)">
    <rect x="0" y="0" width="80" height="55" fill="#5A4A3A" rx="6"/>
    <rect x="28" y="-10" width="24" height="14" fill="#4A3A2A" rx="4"/>
    <rect x="5" y="8" width="70" height="4" fill="#3A2A1A" rx="1"/>
    <rect x="5" y="16" width="70" height="4" fill="#3A2A1A" rx="1"/>
    <!-- Tool pockets -->
    <rect x="5" y="24" width="30" height="26" fill="#4A3A2A" rx="2"/>
    <rect x="45" y="24" width="30" height="26" fill="#4A3A2A" rx="2"/>
    <!-- Tools sticking out -->
    <rect x="12" y="10" width="6" height="20" fill="#8A8A8A" rx="1"/>
    <rect x="22" y="8" width="6" height="22" fill="#E8A040" rx="1"/>
    <rect x="32" y="12" width="4" height="16" fill="#8A8A8A" rx="1"/>
  </g>

  <!-- No Sweat truck / van silhouette -->
  <g transform="translate(30, 360)">
    <rect x="0" y="0" width="70" height="40" fill="#1A3A5C" rx="4"/>
    <rect x="0" y="0" width="70" height="18" fill="#1A3A5C" rx="4"/>
    <!-- Windshield -->
    <rect x="4" y="4" width="28" height="16" fill="#5A8AC0" opacity="0.6" rx="2"/>
    <!-- Van body -->
    <rect x="0" y="14" width="70" height="28" fill="#1A3A5C" rx="2"/>
    <!-- Logo on van -->
    <rect x="30" y="18" width="36" height="20" fill="#E87B2A" rx="2"/>
    <text x="48" y="27" text-anchor="middle" fill="white" font-size="5" font-family="Arial, sans-serif" font-weight="bold">NO SWEAT</text>
    <text x="48" y="34" text-anchor="middle" fill="white" font-size="4" font-family="Arial, sans-serif">MECHANICAL</text>
    <!-- Wheels -->
    <circle cx="16" cy="40" r="8" fill="#2A2A2A" stroke="#4A4A4A" stroke-width="2"/>
    <circle cx="16" cy="40" r="4" fill="#6A6A6A"/>
    <circle cx="54" cy="40" r="8" fill="#2A2A2A" stroke="#4A4A4A" stroke-width="2"/>
    <circle cx="54" cy="40" r="4" fill="#6A6A6A"/>
  </g>

  <!-- PM checklist floating card -->
  <rect x="20" y="100" width="200" height="180" fill="white" rx="6" opacity="0.92"/>
  <rect x="20" y="100" width="200" height="28" fill="#1A3A5C" rx="6"/>
  <rect x="20" y="118" width="200" height="10" fill="#1A3A5C"/>
  <text x="120" y="118" text-anchor="middle" fill="white" font-size="10" font-family="Arial, sans-serif" font-weight="bold">PM CHECKLIST</text>
  <text x="120" y="129" text-anchor="middle" fill="#E87B2A" font-size="8" font-family="Arial, sans-serif">RTU-7 • Quarterly</text>

  <!-- Checklist items -->
  <g transform="translate(30, 140)">
    <!-- Check 1 -->
    <rect x="0" y="0" width="12" height="12" fill="#1A3A5C" rx="2"/>
    <line x1="2" y1="6" x2="5" y2="9" stroke="white" stroke-width="2"/>
    <line x1="5" y1="9" x2="10" y2="3" stroke="white" stroke-width="2"/>
    <text x="18" y="10" fill="#2A3A4A" font-size="9" font-family="Arial, sans-serif">Belt &amp; pulleys inspected</text>

    <rect x="0" y="18" width="12" height="12" fill="#1A3A5C" rx="2"/>
    <line x1="2" y1="24" x2="5" y2="27" stroke="white" stroke-width="2"/>
    <line x1="5" y1="27" x2="10" y2="21" stroke="white" stroke-width="2"/>
    <text x="18" y="28" fill="#2A3A4A" font-size="9" font-family="Arial, sans-serif">Filter replaced (MERV 8)</text>

    <rect x="0" y="36" width="12" height="12" fill="#1A3A5C" rx="2"/>
    <line x1="2" y1="42" x2="5" y2="45" stroke="white" stroke-width="2"/>
    <line x1="5" y1="45" x2="10" y2="39" stroke="white" stroke-width="2"/>
    <text x="18" y="46" fill="#2A3A4A" font-size="9" font-family="Arial, sans-serif">Coils cleaned &amp; inspected</text>

    <rect x="0" y="54" width="12" height="12" fill="#1A3A5C" rx="2"/>
    <line x1="2" y1="60" x2="5" y2="63" stroke="white" stroke-width="2"/>
    <line x1="5" y1="63" x2="10" y2="57" stroke="white" stroke-width="2"/>
    <text x="18" y="64" fill="#2A3A4A" font-size="9" font-family="Arial, sans-serif">Refrigerant charge verified</text>

    <rect x="0" y="72" width="12" height="12" fill="#E87B2A" rx="2"/>
    <text x="18" y="82" fill="#2A3A4A" font-size="9" font-family="Arial, sans-serif">Controls calibrated</text>

    <rect x="0" y="90" width="12" height="12" fill="#D0D0D0" rx="2"/>
    <text x="18" y="100" fill="#8A8A8A" font-size="9" font-family="Arial, sans-serif">Electrical connections</text>

    <rect x="0" y="108" width="12" height="12" fill="#D0D0D0" rx="2"/>
    <text x="18" y="118" fill="#8A8A8A" font-size="9" font-family="Arial, sans-serif">Drain pan &amp; condensate</text>
  </g>

  <!-- Caption -->
  <rect x="0" y="458" width="800" height="42" fill="#1A3A5C" opacity="0.95"/>
  <text x="20" y="476" fill="white" font-size="14" font-family="Arial, sans-serif" font-weight="bold">Preventive Maintenance — HVAC Service</text>
  <text x="20" y="493" fill="#E87B2A" font-size="11" font-family="Arial, sans-serif">Scheduled PM • Filter Service • Refrigerant • Controls — 24/7 Response</text>
  <text x="700" y="481" text-anchor="end" fill="#8AAAC2" font-size="11" font-family="Arial, sans-serif">Henderson, NV</text>
</svg>
